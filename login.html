<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JB STORE • Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif}
body{
  min-height:100vh;
  background:#f8f7f3;
  color:#171717;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:22px 14px;
}
.wrap{width:100%;max-width:430px}
.brand{text-align:center;margin-bottom:18px}
.brand-logo{
  font:700 35px/1 Georgia,"Times New Roman",serif;
  letter-spacing:.5px;color:#171717;
}
.brand-logo::first-letter{color:#d4af37}
.brand-logo span{color:#171717}
.sub{
  margin:6px 0 0;color:#777;
  font:italic 12px Georgia,"Times New Roman",serif;
  letter-spacing:1px;
}
.card{
  background:#fff;
  border:1px solid #e5d9ad;
  border-radius:22px;
  padding:27px 22px 22px;
  box-shadow:0 10px 35px rgba(91,72,20,.10);
  position:relative;
  overflow:hidden;
}
.card::before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,#d4af37,#f1d779,#d4af37);
}
.card::after{
  content:"✦";
  position:absolute;
  top:13px;right:17px;
  color:#d4af37;font-size:14px;
}
h1{
  font:700 31px/1.05 Georgia,"Times New Roman",serif;
  text-align:center;margin:0;color:#191919;
}
.hint{
  color:#777;font-size:11px;line-height:1.55;
  text-align:center;margin:9px 0 21px;
}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.google{
  width:100%;height:51px;
  border:1px solid #ded8c8;border-radius:13px;
  background:#fff;color:#202020;
  font:700 12px Georgia,"Times New Roman",serif;
  cursor:pointer;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}
.google:hover{border-color:#d4af37;background:#fffdf7}
.google i{margin-right:8px}
.or{
  display:flex;align-items:center;gap:11px;color:#a18d53;
  font-size:10px;letter-spacing:2px;margin:19px 0;
}
.or:before,.or:after{
  content:"";height:1px;background:#eadfbd;flex:1
}
label{
  display:block;color:#555;font-size:10px;
  margin:13px 0 6px;font-family:Arial,sans-serif;
}
input{
  width:100%;height:48px;border-radius:12px;
  border:1px solid #dedbd1;background:#faf9f6;
  color:#171717;padding:0 14px;outline:none;font-size:12px;
}
input::placeholder{color:#aaa}
input:focus{
  border-color:#d4af37;
  background:#fff;
  box-shadow:0 0 0 3px rgba(212,175,55,.10);
}
.primary{
  width:100%;height:49px;border:1px solid #c59f20;
  border-radius:12px;background:#d4af37;color:#171717;
  font:700 12px Georgia,"Times New Roman",serif;
  cursor:pointer;margin-top:17px;
  box-shadow:0 6px 16px rgba(212,175,55,.20);
}
.primary:hover{background:#e0bd4c}
.secondary{
  width:100%;height:47px;border:1px solid #dfd4ae;
  border-radius:12px;background:#fff;color:#5a4b24;
  font:700 11px Georgia,"Times New Roman",serif;
  cursor:pointer;margin-top:10px;
}
.secondary:hover{background:#fbf8ed;border-color:#d4af37}
.row{
  display:flex;justify-content:space-between;
  gap:12px;margin-top:15px;
}
.link{
  background:none;border:0;color:#a48220;
  cursor:pointer;font-size:10px;padding:0;
}
.link:hover{color:#d4af37}
.status{
  min-height:19px;text-align:center;font-size:10px;
  margin:13px 0 0;color:#777;line-height:1.5;
  font-family:Arial,sans-serif;
}
.back{
  display:block;text-align:center;margin-top:17px;
  color:#777;text-decoration:none;font-size:10px;
}
.back:hover{color:#a48220}
.guest-note{
  font-size:8px;color:#999;text-align:center;
  margin:13px 0 0;line-height:1.55;
  font-family:Arial,sans-serif;
}
@media(max-width:480px){
  body{padding:16px 11px}
  .card{padding:25px 18px 20px}
  h1{font-size:29px}
  .brand-logo{font-size:32px}
}
</style>
</head>
<body>
  <main class="wrap">
    <div class="brand">
      <div class="brand-logo">JB <span>STORE</span></div>
      <p class="sub">Premium Electronics</p>
    </div>

    <section class="card">
      <h1 id="title">Welcome to JB STORE</h1>
      <p class="hint" id="hint">Login or create your account. Mobile number is not required here.</p>

      <button class="google" id="googleBtn"><i class="fa-brands fa-google"></i> Continue with Google</button>

      <div class="or">OR</div>

      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" placeholder="you@example.com">

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="Enter password">

      <button class="primary" id="loginBtn">Login</button>
      <button class="secondary" id="signupBtn">Create Account</button>

      <div class="row">
        <button class="link" id="resetBtn">Forgot password?</button>
        <button class="link" id="guestBtn">Continue as Guest</button>
      </div>

      <div class="status" id="status"></div>
      <p class="guest-note">Guest accounts can browse and shop. You can add permanent account features later.</p>
    </section>

    <a class="back" href="index.html">← Back to JB STORE</a>
  </main>

<script>
const SUPABASE_URL = 'https://iuucwxdkjqpecqwbsoyv.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1dWN3eGRranFwZWNxd2Jzb3l2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjU4MTksImV4cCI6MjEwMzA0MTgxOX0.UPQ7jf3C_9DX9Jr1y-g6JIxBe2EHOlMAn4CZZyQgLDQ';

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const $ = id => document.getElementById(id);
const status = (msg, ok=false) => {
  $('status').textContent = msg;
  $('status').style.color = ok ? '#6ee7a8' : '#bbb';
};

$('googleBtn').onclick = async () => {
  status('Opening Google…');
  const { error } = await client.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/index.html' }
  });
  if (error) status(error.message);
};

$('loginBtn').onclick = async () => {
  const email = $('email').value.trim();
  const password = $('password').value;
  if (!email || !password) return status('Enter email and password.');
  status('Logging in…');
  const { error } = await client.auth.signInWithPassword({ email, password });
  if (error) return status(error.message);
  window.location.href = 'index.html';
};

$('signupBtn').onclick = async () => {
  const email = $('email').value.trim();
  const password = $('password').value;
  if (!email || !password) return status('Enter email and password.');
  if (password.length < 6) return status('Password must be at least 6 characters.');
  status('Creating account…');
  const { data, error } = await client.auth.signUp({
    email,
    password,
    options: { emailRedirectTo: window.location.origin + '/index.html' }
  });
  if (error) return status(error.message);
  if (data.session) {
    window.location.href = 'index.html';
  } else {
    status('Account created. Check your email and confirm it before logging in.', true);
  }
};

$('resetBtn').onclick = async () => {
  const email = $('email').value.trim();
  if (!email) return status('Enter your email first.');
  status('Sending reset email…');
  const { error } = await client.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/login.html'
  });
  if (error) return status(error.message);
  status('Password reset email sent. Check your inbox.', true);
};

$('guestBtn').onclick = async () => {
  status('Starting guest session…');
  const { error } = await client.auth.signInAnonymously();
  if (error) return status(error.message);
  window.location.href = 'index.html';
};
</script>
</body>
</html>
