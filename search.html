<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Search | JB STORE</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .search-page {
      width: 100%;
      box-sizing: border-box;
      padding: 0 16px 100px;
      margin: 20px auto;
      max-width: 1400px;
    }

    .search-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
      flex-wrap: wrap;
      gap: 10px;
    }
    .search-small {
      color: #D4AF37;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin: 0 0 4px;
      text-transform: uppercase;
    }
    .search-heading h1 {
      color: #111;
      font-size: 26px;
      font-weight: 700;
      margin: 0;
      letter-spacing: .3px;
    }
    #resultCount {
      color: #a3801a;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(212, 175, 55, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.2);
      white-space: nowrap;
    }

    .search-layout { display: block; width: 100%; }
    .search-results { width: 100%; }
    .search-product-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
    }

    .search-product-card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #FFD700 !important;
      box-shadow: 0 0 4px rgba(255, 215, 0, 0.05) !important;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: all .3s ease;
      position: relative;
    }
    .search-product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 8px 30px rgba(212, 175, 55, 0.1) !important;
    }

    .search-product-image {
      position: relative;
      width: 100%;
      height: 180px;
      background: #faf8f2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .search-product-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .search-offer {
      position: absolute;
      top: 10px;
      left: 10px;
      background: linear-gradient(135deg, #D4AF37, #C9A030);
      color: #111;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
      z-index: 2;
    }
    .search-offer:empty { display: none; }

    .search-product-info {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .search-brand {
      color: #a3801a;
      font-size: 11px;
      font-weight: 700;
      margin: 0 0 4px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .search-product-info h3 {
      color: #111;
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 6px;
      line-height: 1.35;
      min-height: 38px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .search-variant-tag {
      display: inline-block;
      background: rgba(212, 175, 55, 0.12);
      color: #a3801a;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 12px;
      margin: 0 0 6px;
      border: 1px solid rgba(212, 175, 55, 0.15);
      align-self: flex-start;
    }
    .search-rating {
      color: #333;
      font-size: 12px;
      margin: 0 0 4px;
      font-weight: 500;
    }
    .search-rating span { color: #888; font-size: 11px; }
    .search-condition {
      color: #666;
      font-size: 11px;
      margin: 0 0 8px;
      font-weight: 500;
    }
    .search-price {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 4px 0 12px;
      flex-wrap: wrap;
    }
    .search-price strong {
      color: #111;
      font-size: 18px;
      font-weight: 700;
    }
    .search-price del {
      color: #999;
      font-size: 12px;
    }

    .search-product-card .deal-actions {
      display: flex;
      gap: 10px;
      margin-top: auto;
      width: 100%;
    }
    .search-product-card .deal-actions button {
      flex: 1;
      height: 40px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: all .3s ease;
      font-family: "Poppins", sans-serif;
    }
    .search-product-card .view-details-btn {
      background: linear-gradient(135deg, #D4AF37, #C9A030);
      color: #0A0A0A;
      box-shadow: 0 2px 15px rgba(212, 175, 55, 0.2);
    }
    .search-product-card .view-details-btn:hover {
      background: linear-gradient(135deg, #E8C84A, #D4AF37);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.35);
    }

    .search-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: #fff;
      border-radius: 20px;
      border: 1px solid rgba(212, 175, 55, 0.15);
    }
    .search-empty div { font-size: 60px; margin-bottom: 14px; }
    .search-empty h2 { color: #111; font-size: 22px; font-weight: 700; margin: 0 0 8px; }
    .search-empty p { color: #777; font-size: 14px; margin: 0; }

    /* ============ PROFILE MODAL ============ */
    .jb-profile-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2147483647;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: env(safe-area-inset-bottom, 20px);
      box-sizing: border-box;
    }
    .jb-profile-modal.show { display: flex; }
    .jb-profile-card {
      width: 100%; max-width: 520px;
      background: #fff; color: #222;
      border-radius: 26px 26px 0 0;
      padding: 24px 20px 60px 20px;
      box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.22);
      max-height: 85%; min-height: 400px;
      overflow-y: auto;
      border-top: 3px solid #d8ad19;
      box-sizing: border-box;
    }
    .jb-profile-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .jb-profile-head h2{margin:0;font-family:Georgia,serif;font-size:25px}
    .jb-profile-close{border:1px solid #e4d7ad;background:#fff;border-radius:50%;width:38px;height:38px;font-size:24px;cursor:pointer;color:#777}
    .jb-profile-avatar{width:72px;height:72px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:#fffaf0;border:2px solid #dfbd4a;font-size:35px;}
    .jb-profile-field{margin:0 0 14px}
    .jb-profile-field label{display:block;font-weight:700;font-size:13px;margin-bottom:7px;color:#555}
    .jb-profile-field input,.jb-profile-field textarea{width:100%;box-sizing:border-box;border:1px solid #ddd8ca;border-radius:13px;background:#faf9f5;padding:13px 14px;font-size:15px;outline:none;font-family:inherit;}
    .jb-profile-field input:focus,.jb-profile-field textarea:focus{border-color:#d5ad22;box-shadow:0 0 0 3px rgba(213,173,34,.12)}
    .jb-profile-field textarea{min-height:82px;resize:vertical}
    .jb-profile-save{width:100%;border:0;border-radius:14px;padding:14px;background:#dfb500;color:#111;font-size:16px;font-weight:800;cursor:pointer;margin-top:5px;}
    .jb-profile-status{text-align:center;min-height:20px;margin-top:10px;font-size:13px;color:#777}
    .jb-profile-field input[readonly]{background:#f4f2ec;color:#666;}
    .jb-profile-logout{width:100%;border:1px solid #e6c9c9;border-radius:14px;padding:13px;background:#fff;color:#b00020;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;font-family:inherit;}
    .jb-profile-logout:hover{background:#fff5f5;}

    @media (max-width: 768px) {
      .search-page { padding: 0 12px 90px; margin: 12px auto; }
      .search-heading { margin-bottom: 16px; padding-bottom: 12px; }
      .search-heading h1 { font-size: 18px; }
      .search-small { font-size: 10px; }
      #resultCount { font-size: 11px; padding: 4px 12px; }
      .search-product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .search-product-image { height: 140px; padding: 8px; }
      .search-product-info { padding: 10px; }
      .search-product-info h3 { font-size: 12.5px; min-height: 32px; }
      .search-brand { font-size: 10px; }
      .search-rating { font-size: 11px; }
      .search-condition { font-size: 10px; }
      .search-price strong { font-size: 15px; }
      .search-price del { font-size: 10px; }
      .search-product-card .deal-actions button { height: 34px; font-size: 11px; }
      .search-variant-tag { font-size: 9.5px; padding: 1px 8px; }
    }
    @media (max-width: 450px) {
      .search-product-grid { gap: 8px; }
      .search-product-image { height: 130px; }
    }
  </style>
</head>

<!-- ===== SEARCH PAGE MAIN LOGIC (SAFE VERSION) ===== -->
<script>
(function () {
  'use strict';

  /* ✅ Step 1: Collect local products (script.js nunchi conflict rakunda) */
  var localProducts = [];
  function collect(name) {
    try {
      var arr = window[name];
      if (Array.isArray(arr)) { localProducts = localProducts.concat(arr); }
    } catch(e) {}
  }
  collect('mobileProducts');
  collect('refrigeratorProducts');
  collect('washingProducts');
  collect('acProducts');
  collect('tvProducts');

  console.log('[search] Local products:', localProducts.length);

  /* ✅ Step 2: Global store for this page — do NOT name it `allProducts` */
  window.__searchProducts = localProducts.slice();

  /* ✅ Step 3: Params */
  var params = new URLSearchParams(window.location.search);
  var term  = (params.get('q') || '').trim();
  var brand = (params.get('brand') || '').trim();
  var cat   = (params.get('category') || '').trim();

  var inputEl   = document.getElementById('searchInput');
  var gridEl    = document.getElementById('searchProductGrid');
  var titleEl   = document.getElementById('searchTitle');
  var countEl   = document.getElementById('resultCount');
  var suggestEl = document.getElementById('searchSuggestions');

  var catNames = {
    mobiles: 'Mobiles',
    fridge:  'Refrigerators',
    washing: 'Washing Machines',
    ac:      'AC',
    tv:      'TV'
  };

  /* Set input + title */
  if (brand && cat) {
    var cName = catNames[cat] || cat;
    if (inputEl) inputEl.value = brand + ' ' + cName;
    if (titleEl) titleEl.textContent = brand + ' ' + cName;
  } else if (term) {
    if (inputEl) inputEl.value = term;
    if (titleEl) titleEl.textContent = '"' + term + '"';
  } else {
    if (inputEl) inputEl.value = '';
    if (titleEl) titleEl.textContent = 'All Products';
  }

  /* Filter */
  function filterProducts() {
    var list = window.__searchProducts || [];

    if (brand && cat) {
      var bl = brand.toLowerCase(), cl = cat.toLowerCase();
      return list.filter(function (p) {
        return String(p.brand || '').trim().toLowerCase() === bl &&
               String(p.category || '').trim().toLowerCase() === cl;
      });
    }

    if (!term) return list;

    var t = term.toLowerCase();
    return list.filter(function (p) {
      return String(p.name      || '').toLowerCase().indexOf(t) !== -1 ||
             String(p.brand     || '').toLowerCase().indexOf(t) !== -1 ||
             String(p.id        || '').toLowerCase().indexOf(t) !== -1 ||
             String(p.category  || '').toLowerCase().indexOf(t) !== -1 ||
             String(p.condition || '').toLowerCase().indexOf(t) !== -1;
    });
  }

  /* View product */
  window.__viewProduct = function (id) {
    try { localStorage.setItem('selectedProduct', JSON.stringify({ id: id })); } catch(e) {}
    window.location.href = 'product.html?id=' + encodeURIComponent(id);
  };

  /* Escape HTML */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  /* Render */
  function render() {
    if (!gridEl) return;
    var products = filterProducts();
    gridEl.innerHTML = '';
    if (countEl) countEl.textContent = products.length + ' Products';

    if (!products.length) {
      gridEl.innerHTML =
        '<div class="search-empty">' +
          '<div>🔍</div>' +
          '<h2>No products found</h2>' +
          '<p>Try another product or brand.</p>' +
        '</div>';
      return;
    }

    products.forEach(function (product) {
      var card = document.createElement('div');
      card.className = 'search-product-card';

      var image = product.image ||
                  (Array.isArray(product.images) && product.images[0]) ||
                  'images/placeholder.png';

      var firstVariant = (Array.isArray(product.variants) && product.variants.length)
                          ? product.variants[0].label : null;
      var variantHTML = firstVariant
        ? '<div class="search-variant-tag">📱 ' + esc(firstVariant) + '</div>'
        : '';

      card.innerHTML =
        '<div class="search-product-image">' +
          '<span class="search-offer">' + esc(product.discount || '') + '</span>' +
          '<img src="' + esc(image) + '" alt="' + esc(product.name || '') + '" ' +
               'onerror="this.onerror=null;this.style.opacity=0.3">' +
        '</div>' +
        '<div class="search-product-info">' +
          '<p class="search-brand">' + esc(product.brand || '') + '</p>' +
          '<h3>' + esc(product.name || '') + '</h3>' +
          variantHTML +
          '<div class="search-rating">⭐ ' + esc(product.rating || '4.5') +
            ' <span>(' + esc(product.reviews || 0) + ')</span></div>' +
          '<p class="search-condition">' + esc(product.condition || 'New') + '</p>' +
          '<div class="search-price">' +
            '<strong>₹' + Number(product.price || 0).toLocaleString('en-IN') + '</strong>' +
            (product.oldPrice
              ? '<del>₹' + Number(product.oldPrice).toLocaleString('en-IN') + '</del>'
              : '') +
          '</div>' +
          '<div class="deal-actions">' +
            '<button type="button" class="view-details-btn">🔍 View Details</button>' +
          '</div>' +
        '</div>';

      card.addEventListener('click', function (e) {
        if (e.target.closest('button')) return;
        window.__viewProduct(product.id);
      });

      var btn = card.querySelector('.view-details-btn');
      if (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          window.__viewProduct(product.id);
        });
      }

      gridEl.appendChild(card);
    });
  }

  /* Expose for Supabase */
  window.__renderSearch = render;
  window.__setAllProducts = function (data) {
    if (Array.isArray(data) && data.length) {
      window.__searchProducts = data;
      console.log('[search] Supabase products set:', data.length);
      render();
    }
  };

  /* Initial render with local products */
  render();

  /* ========== SUPABASE FETCH (background, no blocking) ========== */
  try {
    if (typeof supabase !== 'undefined') {
      var SUPABASE_URL  = 'https://iuucwxdkjqpecqwbsoyv.supabase.co';
      var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1dWN3eGRranFwZWNxd2Jzb3l2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjU4MTksImV4cCI6MjEwMzA0MTgxOX0.UPQ7jf3C_9DX9Jr1y-g6JIxBe2EHOlMAn4CZZyQgLDQ';
      var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

      sb.from('products').select('*').order('id', { ascending: true })
        .then(function (res) {
          if (res.error) { console.warn('[search] fetch error:', res.error.message); return; }
          if (res.data && res.data.length) {
            window.__setAllProducts(res.data);
          }
        })
        .catch(function (e) { console.warn('[search] fetch failed:', e); });

      // Realtime
      sb.channel('search-products-rt')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, function () {
          sb.from('products').select('*').order('id', { ascending: true })
            .then(function (res) {
              if (res.data && res.data.length) window.__setAllProducts(res.data);
            });
        })
        .subscribe();
    }
  } catch (e) { console.warn('[search] Supabase init error:', e); }

  /* ========== SUGGESTIONS ========== */
  function highlight(text, q) {
    var safe = esc(text);
    if (!q) return safe;
    var escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return safe.replace(new RegExp('(' + escaped + ')', 'ig'), '<strong>$1</strong>');
  }

  function showSuggestions() {
    if (!inputEl || !suggestEl) return;
    var text = inputEl.value.trim().toLowerCase();
    suggestEl.innerHTML = '';

    if (!text) { suggestEl.classList.remove('show'); return; }

    var all = window.__searchProducts || [];
    var map = {};
    all.forEach(function (p) {
      var b = String(p.brand || '').trim();
      var c = String(p.category || '').trim();
      if (!b || !c) return;
      if (b.toLowerCase().indexOf(text) !== -1 ||
          c.toLowerCase().indexOf(text) !== -1 ||
          String(p.name || '').toLowerCase().indexOf(text) !== -1) {
        var key = b.toLowerCase() + '|' + c.toLowerCase();
        if (!map[key]) {
          map[key] = {
            brand: b, category: c,
            image: p.image || (p.images && p.images[0]) || '',
            name: p.name
          };
        }
      }
    });

    var arr = Object.keys(map).map(function (k) { return map[k]; });
    arr.sort(function (a, b) {
      var as = a.brand.toLowerCase().indexOf(text) === 0 ? 0 : 1;
      var bs = b.brand.toLowerCase().indexOf(text) === 0 ? 0 : 1;
      return as - bs || a.brand.localeCompare(b.brand);
    });
    arr = arr.slice(0, 10);

    if (!arr.length) {
      suggestEl.innerHTML = '<div class="search-no-result">No products found</div>';
      suggestEl.classList.add('show');
      return;
    }

    arr.forEach(function (item) {
      var row = document.createElement('div');
      row.className = 'search-suggestion';
      var cName = catNames[item.category] || item.category;
      row.innerHTML =
        '<img src="' + esc(item.image) + '" alt="" ' +
             'onerror="this.style.background=\'#f2efe9\'">' +
        '<div class="suggestion-info">' +
          '<div class="suggestion-name">' + highlight(item.brand, text) + ' ' + esc(cName) + '</div>' +
          '<div class="suggestion-category">' + esc(item.name || '') + '</div>' +
        '</div>' +
        '<span class="suggestion-arrow">↗</span>';

      row.addEventListener('click', function () {
        window.location.href =
          'search.html?brand=' + encodeURIComponent(item.brand) +
          '&category=' + encodeURIComponent(item.category);
      });
      suggestEl.appendChild(row);
    });

    suggestEl.classList.add('show');
  }

  if (inputEl) {
    inputEl.addEventListener('input', showSuggestions);
    inputEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        var v = inputEl.value.trim();
        if (v) window.location.href = 'search.html?q=' + encodeURIComponent(v);
      }
    });
  }

  var searchBtn = document.getElementById('searchButton');
  if (searchBtn) {
    searchBtn.addEventListener('click', function () {
      var v = inputEl ? inputEl.value.trim() : '';
      if (v) window.location.href = 'search.html?q=' + encodeURIComponent(v);
    });
  }

  document.addEventListener('click', function (e) {
    if (inputEl && suggestEl &&
        !inputEl.contains(e.target) && !suggestEl.contains(e.target)) {
      suggestEl.classList.remove('show');
    }
  });

  console.log('[search] ready. Products:', (window.__searchProducts || []).length);
})();
</script>

<!-- ===== MENU DRAWER + ACCOUNT + PROFILE LOGIC ===== -->
<script>
(function () {
  const SUPABASE_URL = 'https://iuucwxdkjqpecqwbsoyv.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1dWN3eGRranFwZWNxd2Jzb3l2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjU4MTksImV4cCI6MjEwMzA0MTgxOX0.UPQ7jf3C_9DX9Jr1y-g6JIxBe2EHOlMAn4CZZyQgLDQ';
  const $ = id => document.getElementById(id);

  const menuToggle  = $('menuToggle');
  const menuDrawer  = $('menuDrawer');
  const menuOverlay = $('menuOverlay');
  const menuClose   = $('menuClose');
  const headerLink  = $('headerAccountLink');
  const menuLink    = $('menuAccountLink');
  const menuText    = $('menuAccountText');
  const menuIcon    = $('menuAccountIcon');

  let client = null;
  if (typeof supabase !== 'undefined') { try { client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON); } catch(e){} }
  let user = null;

  function openDrawer() {
    menuDrawer.classList.add('open');
    menuOverlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    document.body.classList.add('menu-open');
  }
  function closeDrawer() {
    menuDrawer.classList.remove('open');
    menuOverlay.classList.remove('open');
    document.body.style.overflow = '';
    document.body.classList.remove('menu-open');
  }

  if (menuToggle)  menuToggle.addEventListener('click', openDrawer);
  if (menuClose)   menuClose.addEventListener('click', closeDrawer);
  if (menuOverlay) menuOverlay.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

  async function updateAccountUI() {
    if (!client) return;
    const { data } = await client.auth.getSession();
    const session = data && data.session;
    user = session ? session.user : null;
    if (user) {
      if (menuLink) { menuLink.setAttribute('href', 'javascript:void(0)'); menuLink.classList.add('account-active'); }
      if (menuText) menuText.textContent = 'My Account';
      if (menuIcon) menuIcon.textContent = '👤';
      if (headerLink) { headerLink.setAttribute('href', 'javascript:void(0)'); headerLink.setAttribute('aria-label', 'My Account'); }
    } else {
      if (menuLink) { menuLink.setAttribute('href', 'login.html'); menuLink.classList.remove('account-active'); }
      if (menuText) menuText.textContent = 'Login / Account';
      if (menuIcon) menuIcon.textContent = '👤';
      if (headerLink) { headerLink.setAttribute('href', 'login.html'); headerLink.setAttribute('aria-label', 'Login'); }
    }
  }
  updateAccountUI();
  if (client) client.auth.onAuthStateChange(() => setTimeout(updateAccountUI, 0));

  function friendlyName(u) {
    const meta = u.user_metadata || {};
    let n = meta.full_name || meta.name || meta.display_name || '';
    if (!n && u.is_anonymous) n = 'Guest User';
    if (!n && u.email) { const l = u.email.split('@')[0].replace(/[._-]+/g,' ').trim(); n = l.replace(/\b\w/g, c => c.toUpperCase()); }
    return n;
  }
  function providerText(u) {
    if (u.is_anonymous) return 'Guest account';
    const p = (u.app_metadata && u.app_metadata.provider) || '';
    if (p === 'google') return 'Signed in with Google';
    if (p === 'phone') return 'Signed in with Mobile OTP';
    return 'Signed in with Email & Password';
  }

  async function openProfile() {
    try { const { data } = await client.auth.getUser(); if (data && data.user) user = data.user; } catch(e){}
    if (!user) { window.location.href = 'login.html'; return; }
    const meta = user.user_metadata || {};
    $('jbProfileEmail').value = user.is_anonymous ? 'Guest account' : (user.email || '');
    $('jbProfileName').value = friendlyName(user);
    $('jbProfileMobile').value = meta.mobile || meta.phone || '';
    $('jbProfileAddress').value = meta.address || '';
    $('jbProfileProvider').textContent = providerText(user);
    $('jbProfileStatus').textContent = '';
    $('jbProfileModal').classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  function closeProfile() {
    $('jbProfileModal').classList.remove('show');
    document.body.style.overflow = '';
  }

  if (headerLink) headerLink.addEventListener('click', e => {
    e.preventDefault();
    if (!user) { window.location.href = 'login.html'; return; }
    openProfile();
  });
  if (menuLink) menuLink.addEventListener('click', e => {
    e.preventDefault();
    if (!user) { window.location.href = 'login.html'; return; }
    closeDrawer();
    setTimeout(openProfile, 300);
  });
  if ($('jbProfileClose')) $('jbProfileClose').addEventListener('click', closeProfile);
  if ($('jbProfileModal')) $('jbProfileModal').addEventListener('click', e => { if (e.target === $('jbProfileModal')) closeProfile(); });

  if ($('jbProfileSave')) {
    $('jbProfileSave').addEventListener('click', async function() {
      const n = $('jbProfileName').value.trim();
      const m = $('jbProfileMobile').value.trim();
      const a = $('jbProfileAddress').value.trim();
      if (m && !/^[0-9]{10}$/.test(m)) { $('jbProfileStatus').textContent = 'Please enter a valid 10-digit mobile number.'; return; }
      $('jbProfileSave').disabled = true; $('jbProfileSave').textContent = 'Saving...';
      const { data, error } = await client.auth.updateUser({ data: { full_name: n, name: n, mobile: m, address: a, profile_completed: true } });
      $('jbProfileSave').disabled = false; $('jbProfileSave').textContent = 'Save Profile';
      if (error) { $('jbProfileStatus').textContent = error.message; return; }
      if (data && data.user) user = data.user;
      $('jbProfileStatus').textContent = '✓ Profile saved successfully';
      setTimeout(closeProfile, 700);
    });
  }
  if ($('jbProfileLogout')) {
    $('jbProfileLogout').addEventListener('click', async function() {
      await client.auth.signOut();
      closeProfile();
      window.location.href = 'login.html';
    });
  }

  function refreshBadges() {
    try {
      const cartKeys = ['cart','jb_cart','jbstore_cart','jbCart','cartItems'];
      let cartQty = 0;
      for (const k of cartKeys) {
        const raw = localStorage.getItem(k);
        if (raw) { const v = JSON.parse(raw); if (Array.isArray(v)) { cartQty = v.reduce((s,i)=>s+(Number(i.qty||i.quantity||1)),0); break; } }
      }
      document.querySelectorAll('.cart-badge,#cartBadge,#menuCartBadge').forEach(el => { el.textContent = cartQty; el.style.display = cartQty > 0 ? 'flex' : 'none'; });

      const favKeys = ['favorites','jb_favorites','favoritesList','jbFav'];
      let favCount = 0;
      for (const k of favKeys) {
        const raw = localStorage.getItem(k);
        if (raw) { const v = JSON.parse(raw); if (Array.isArray(v)) { favCount = v.length; break; } }
      }
      document.querySelectorAll('.fav-badge,#favBadge,#menuFavBadge').forEach(el => { el.textContent = favCount; el.style.display = favCount > 0 ? 'flex' : 'none'; });
    } catch(e){}
  }
  refreshBadges();
  setInterval(refreshBadges, 1500);
})();
</script>
