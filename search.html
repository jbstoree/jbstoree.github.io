<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Search | JB STORE</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ============ SEARCH PAGE ============ */
    .search-page {
      width: 100%;
      box-sizing: border-box;
      padding: 0 16px 100px;
      margin: 20px auto;
      max-width: 1400px;
    }

    .search-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
      flex-wrap: wrap;
      gap: 10px;
    }
    .search-small {
      color: #D4AF37;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin: 0 0 4px;
      text-transform: uppercase;
    }
    .search-heading h1 {
      color: #111;
      font-size: 26px;
      font-weight: 700;
      margin: 0;
      letter-spacing: .3px;
      font-family: "Poppins", sans-serif;
    }
    #resultCount {
      color: #a3801a;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 20px;
      background: rgba(212, 175, 55, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.2);
      white-space: nowrap;
    }

    /* ============ PRODUCT GRID ============ */
    .search-layout { display: block; width: 100%; }
    .search-results { width: 100%; }
    .search-product-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
    }

    /* ============ SEARCH PRODUCT CARD ============ */
    .search-product-card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #FFD700 !important;
      box-shadow: 0 0 4px rgba(255, 215, 0, 0.05) !important;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: all .3s ease;
      position: relative;
    }
    .search-product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 8px 30px rgba(212, 175, 55, 0.1) !important;
    }

    .search-product-image {
      position: relative;
      width: 100%;
      height: 180px;
      background: #faf8f2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .search-product-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .search-offer {
      position: absolute;
      top: 10px;
      left: 10px;
      background: linear-gradient(135deg, #D4AF37, #C9A030);
      color: #111;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
      z-index: 2;
    }
    .search-offer:empty { display: none; }

    .search-product-info {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .search-brand {
      color: #a3801a;
      font-size: 11px;
      font-weight: 700;
      margin: 0 0 4px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .search-product-info h3 {
      color: #111;
      font-size: 14px;
      font-weight: 600;
      margin: 0 0 6px;
      line-height: 1.35;
      min-height: 38px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .search-variant-tag {
      display: inline-block;
      background: rgba(212, 175, 55, 0.12);
      color: #a3801a;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 12px;
      margin: 0 0 6px;
      border: 1px solid rgba(212, 175, 55, 0.15);
      align-self: flex-start;
    }
    .search-rating {
      color: #333;
      font-size: 12px;
      margin: 0 0 4px;
      font-weight: 500;
    }
    .search-rating span { color: #888; font-size: 11px; }
    .search-condition {
      color: #666;
      font-size: 11px;
      margin: 0 0 8px;
      font-weight: 500;
    }
    .search-price {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin: 4px 0 12px;
      flex-wrap: wrap;
    }
    .search-price strong {
      color: #111;
      font-size: 18px;
      font-weight: 700;
    }
    .search-price del {
      color: #999;
      font-size: 12px;
    }

    .search-product-card .deal-actions {
      display: flex;
      gap: 10px;
      margin-top: auto;
      width: 100%;
    }
    .search-product-card .deal-actions button {
      flex: 1;
      height: 40px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: all .3s ease;
      font-family: "Poppins", sans-serif;
    }
    .search-product-card .view-details-btn {
      background: linear-gradient(135deg, #D4AF37, #C9A030);
      color: #0A0A0A;
      box-shadow: 0 2px 15px rgba(212, 175, 55, 0.2);
    }
    .search-product-card .view-details-btn:hover {
      background: linear-gradient(135deg, #E8C84A, #D4AF37);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.35);
    }

    /* ============ EMPTY ============ */
    .search-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      background: #fff;
      border-radius: 20px;
      border: 1px solid rgba(212, 175, 55, 0.15);
    }
    .search-empty div {
      font-size: 60px;
      margin-bottom: 14px;
    }
    .search-empty h2 {
      color: #111;
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 8px;
    }
    .search-empty p {
      color: #777;
      font-size: 14px;
      margin: 0;
    }

    /* ============ PROFILE MODAL ============ */
    .jb-profile-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 2147483647;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: env(safe-area-inset-bottom, 20px);
      box-sizing: border-box;
    }
    .jb-profile-modal.show { display: flex; }
    .jb-profile-card {
      width: 100%; max-width: 520px;
      background: #fff; color: #222;
      border-radius: 26px 26px 0 0;
      padding: 24px 20px 60px 20px;
      box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.22);
      max-height: 85%; min-height: 400px;
      overflow-y: auto;
      border-top: 3px solid #d8ad19;
      box-sizing: border-box;
    }
    .jb-profile-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .jb-profile-head h2{margin:0;font-family:Georgia,serif;font-size:25px}
    .jb-profile-close{border:1px solid #e4d7ad;background:#fff;border-radius:50%;width:38px;height:38px;font-size:24px;cursor:pointer;color:#777}
    .jb-profile-avatar{width:72px;height:72px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:#fffaf0;border:2px solid #dfbd4a;font-size:35px;}
    .jb-profile-field{margin:0 0 14px}
    .jb-profile-field label{display:block;font-weight:700;font-size:13px;margin-bottom:7px;color:#555}
    .jb-profile-field input,.jb-profile-field textarea{width:100%;box-sizing:border-box;border:1px solid #ddd8ca;border-radius:13px;background:#faf9f5;padding:13px 14px;font-size:15px;outline:none;font-family:inherit;}
    .jb-profile-field input:focus,.jb-profile-field textarea:focus{border-color:#d5ad22;box-shadow:0 0 0 3px rgba(213,173,34,.12)}
    .jb-profile-field textarea{min-height:82px;resize:vertical}
    .jb-profile-save{width:100%;border:0;border-radius:14px;padding:14px;background:#dfb500;color:#111;font-size:16px;font-weight:800;cursor:pointer;margin-top:5px;}
    .jb-profile-status{text-align:center;min-height:20px;margin-top:10px;font-size:13px;color:#777}
    .jb-profile-field input[readonly]{background:#f4f2ec;color:#666;}
    .jb-profile-logout{width:100%;border:1px solid #e6c9c9;border-radius:14px;padding:13px;background:#fff;color:#b00020;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;font-family:inherit;}
    .jb-profile-logout:hover{background:#fff5f5;}

    /* ============ MOBILE ============ */
    @media (max-width: 768px) {
      .search-page { padding: 0 12px 90px; margin: 12px auto; }
      .search-heading { margin-bottom: 16px; padding-bottom: 12px; }
      .search-heading h1 { font-size: 18px; }
      .search-small { font-size: 10px; }
      #resultCount { font-size: 11px; padding: 4px 12px; }

      .search-product-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .search-product-image { height: 140px; padding: 8px; }
      .search-product-info { padding: 10px; }
      .search-product-info h3 { font-size: 12.5px; min-height: 32px; }
      .search-brand { font-size: 10px; }
      .search-rating { font-size: 11px; }
      .search-condition { font-size: 10px; }
      .search-price strong { font-size: 15px; }
      .search-price del { font-size: 10px; }
      .search-product-card .deal-actions button { height: 34px; font-size: 11px; }
      .search-variant-tag { font-size: 9.5px; padding: 1px 8px; }
    }
    @media (max-width: 450px) {
      .search-product-grid { gap: 8px; }
      .search-product-image { height: 130px; }
    }
  </style>
</head>

<script>
(function () {
  const SUPABASE_URL = 'https://iuucwxdkjqpecqwbsoyv.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1dWN3eGRranFwZWNxd2Jzb3l2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjU4MTksImV4cCI6MjEwMzA0MTgxOX0.UPQ7jf3C_9DX9Jr1y-g6JIxBe2EHOlMAn4CZZyQgLDQ';
  if (typeof supabase === 'undefined') return;
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  async function fetchAndUpdateProducts() {
    try {
      const { data, error } = await supabaseClient
        .from('products').select('*').order('id', { ascending: true });
      if (error) throw error;
      if (!data || !data.length) return;

      // global allProducts ni replace cheyyi
      if (typeof window.__setAllProducts === 'function') {
        window.__setAllProducts(data);
      }
    } catch (err) {
      console.error('❌ Failed to fetch products:', err);
    }
  }
  fetchAndUpdateProducts();

  // Realtime
  supabaseClient.channel('search-products')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, () => {
      fetchAndUpdateProducts();
    })
    .subscribe();
})();
</script>

<!-- ===== SEARCH PAGE MAIN LOGIC ===== -->
<script>
// ==========================================
// LOCAL PRODUCTS (initial fallback)
// ==========================================
let allProducts = [];
try {
  if (typeof mobileProducts !== 'undefined') allProducts.push(...mobileProducts);
  if (typeof refrigeratorProducts !== 'undefined') allProducts.push(...refrigeratorProducts);
  if (typeof washingProducts !== 'undefined') allProducts.push(...washingProducts);
  if (typeof acProducts !== 'undefined') allProducts.push(...acProducts);
  if (typeof tvProducts !== 'undefined') allProducts.push(...tvProducts);
} catch(e) {
  console.warn('Local products not loaded', e);
}

// Expose setter so Supabase can replace products
window.__setAllProducts = function(data) {
  allProducts = Array.isArray(data) ? data : [];
  console.log('✅ Products set from Supabase:', allProducts.length);
  displaySearchPageProducts(getSearchPageProducts());
};

console.log('Total products loaded (initial):', allProducts.length);

// ==========================================
// SEARCH PARAMS
// ==========================================
const searchPageParams = new URLSearchParams(window.location.search);
let searchPageTerm = (searchPageParams.get("q") || "").trim();
let searchPageBrand = (searchPageParams.get("brand") || "").trim();
let searchPageCategory = (searchPageParams.get("category") || "").trim();

const searchPageInput = document.getElementById("searchInput");
const searchPageGrid = document.getElementById("searchProductGrid");
const searchPageTitle = document.getElementById("searchTitle");
const searchPageCount = document.getElementById("resultCount");

const searchPageCategoryNames = {
  mobiles: "Mobiles",
  fridge: "Refrigerators",
  washing: "Washing Machines",
  ac: "AC",
  tv: "TV"
};

// ==========================================
// SET SEARCH BOX + TITLE
// ==========================================
if (searchPageBrand && searchPageCategory) {
  const categoryName = searchPageCategoryNames[searchPageCategory] || searchPageCategory;
  searchPageInput.value = `${searchPageBrand} ${categoryName}`;
  searchPageTitle.innerText = `${searchPageBrand} ${categoryName}`;
} else if (searchPageTerm) {
  searchPageInput.value = searchPageTerm;
  searchPageTitle.innerText = `"${searchPageTerm}"`;
} else {
  searchPageInput.value = "";
  searchPageTitle.innerText = "All Products";
}

// ==========================================
// GET SEARCH RESULTS
// ==========================================
function getSearchPageProducts() {
  if (searchPageBrand && searchPageCategory) {
    return allProducts.filter(product => {
      const pb = String(product.brand || "").trim().toLowerCase();
      const pc = String(product.category || "").trim().toLowerCase();
      return pb === searchPageBrand.toLowerCase() && pc === searchPageCategory.toLowerCase();
    });
  }

  const text = searchPageTerm.toLowerCase();
  if (!text) return allProducts;

  return allProducts.filter(product => {
    return (
      String(product.name || "").toLowerCase().includes(text) ||
      String(product.brand || "").toLowerCase().includes(text) ||
      String(product.id || "").toLowerCase().includes(text) ||
      String(product.category || "").toLowerCase().includes(text) ||
      String(product.condition || "").toLowerCase().includes(text)
    );
  });
}

// ==========================================
// FIRST VARIANT
// ==========================================
function getFirstVariant(product) {
  if (product.variants && product.variants.length > 0) return product.variants[0].label;
  return null;
}

// ==========================================
// DISPLAY PRODUCTS
// ==========================================
function displaySearchPageProducts(products) {
  searchPageGrid.innerHTML = "";
  searchPageCount.innerText = `${products.length} Products`;

  if (!products.length) {
    searchPageGrid.innerHTML = `
      <div class="search-empty">
        <div>🔍</div>
        <h2>No products found</h2>
        <p>Try another product or brand.</p>
      </div>
    `;
    return;
  }

  products.forEach(product => {
    const card = document.createElement("div");
    card.className = "search-product-card";
    card.addEventListener("click", e => {
      if (e.target.closest("button")) return;
      viewProduct(product.id);
    });

    const image = product.image || product.images?.[0] || "images/placeholder.png";
    const firstVariant = getFirstVariant(product);
    const variantHTML = firstVariant ? `<div class="search-variant-tag">📱 ${firstVariant}</div>` : "";

    card.innerHTML = `
      <div class="search-product-image">
        <span class="search-offer">${product.discount || ""}</span>
        <img src="${image}" alt="${product.name || 'Product'}" onerror="this.onerror=null;this.style.opacity=.3">
      </div>
      <div class="search-product-info">
        <p class="search-brand">${product.brand || ""}</p>
        <h3>${product.name || ""}</h3>
        ${variantHTML}
        <div class="search-rating">⭐ ${product.rating || "4.5"} <span>(${product.reviews || 0})</span></div>
        <p class="search-condition">${product.condition || "New"}</p>
        <div class="search-price">
          <strong>₹${Number(product.price || 0).toLocaleString("en-IN")}</strong>
          ${product.oldPrice ? `<del>₹${Number(product.oldPrice).toLocaleString("en-IN")}</del>` : ""}
        </div>
        <div class="deal-actions">
          <button type="button" class="view-details-btn" onclick="event.stopPropagation();viewProduct('${product.id}')">
            🔍 View Details
          </button>
        </div>
      </div>
    `;
    searchPageGrid.appendChild(card);
  });
}

// ==========================================
// VIEW PRODUCT
// ==========================================
function viewProduct(id) {
  localStorage.setItem('selectedProduct', JSON.stringify({ id: id }));
  window.location.href = `product.html?id=${encodeURIComponent(id)}`;
}

// ==========================================
// SEARCH SUGGESTIONS
// ==========================================
const searchInput = document.getElementById('searchInput');
const searchSuggestions = document.getElementById('searchSuggestions');

function createSearchSuggestions() {
  if (!searchInput || !searchSuggestions) return;
  const text = searchInput.value.trim().toLowerCase();
  searchSuggestions.innerHTML = "";

  if (text === "") {
    searchSuggestions.classList.remove("show");
    return;
  }

  const combinations = new Map();
  allProducts.forEach(product => {
    const brand = String(product.brand || "").trim();
    const category = String(product.category || "").trim();
    if (!brand || !category) return;

    const brandLower = brand.toLowerCase();
    const categoryLower = category.toLowerCase();

    if (brandLower.includes(text) || categoryLower.includes(text) || String(product.name||"").toLowerCase().includes(text)) {
      const key = `${brandLower}|${categoryLower}`;
      if (!combinations.has(key)) {
        combinations.set(key, {
          brand: brand,
          category: category,
          image: product.image || product.images?.[0] || '',
          productName: product.name,
          productId: product.id
        });
      }
    }
  });

  const suggestions = Array.from(combinations.values());
  suggestions.sort((a, b) => {
    const aStarts = a.brand.toLowerCase().startsWith(text);
    const bStarts = b.brand.toLowerCase().startsWith(text);
    if (aStarts && !bStarts) return -1;
    if (!aStarts && bStarts) return 1;
    return a.brand.localeCompare(b.brand);
  });

  const finalResults = suggestions.slice(0, 10);

  if (finalResults.length === 0) {
    searchSuggestions.innerHTML = `<div class="search-no-result">No products found</div>`;
    searchSuggestions.classList.add("show");
    return;
  }

  finalResults.forEach(item => {
    const row = document.createElement("div");
    row.className = "search-suggestion";
    const displayCategory = searchPageCategoryNames[item.category] || item.category;

    row.innerHTML = `
      <img src="${item.image}" alt="">
      <div class="suggestion-info">
        <div class="suggestion-name">
          ${highlightSearch(item.brand, text)} ${displayCategory}
        </div>
        <div class="suggestion-category">${item.productName || item.brand + ' ' + displayCategory}</div>
      </div>
      <span class="suggestion-arrow">↗</span>
    `;

    row.addEventListener("click", () => {
      window.location.href = "search.html?brand=" + encodeURIComponent(item.brand) + "&category=" + encodeURIComponent(item.category);
    });

    searchSuggestions.appendChild(row);
  });

  searchSuggestions.classList.add("show");
}

function highlightSearch(text, search) {
  const escaped = search.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return text.replace(new RegExp(`(${escaped})`, "ig"), "<strong>$1</strong>");
}

if (searchInput) {
  searchInput.addEventListener("input", createSearchSuggestions);
  searchInput.addEventListener("keydown", event => {
    if (event.key === "Enter") {
      const value = searchInput.value.trim();
      if (value) window.location.href = "search.html?q=" + encodeURIComponent(value);
    }
  });
}

document.getElementById("searchButton")?.addEventListener("click", () => {
  const value = searchInput.value.trim();
  if (value) window.location.href = "search.html?q=" + encodeURIComponent(value);
});

document.addEventListener("click", event => {
  if (searchInput && searchSuggestions && !searchInput.contains(event.target) && !searchSuggestions.contains(event.target)) {
    searchSuggestions.classList.remove("show");
  }
});

// ==========================================
// INITIAL RENDER
// ==========================================
displaySearchPageProducts(getSearchPageProducts());
</script>

<!-- ===== MENU DRAWER + ACCOUNT + PROFILE LOGIC ===== -->
<script>
(function () {
  const SUPABASE_URL = 'https://iuucwxdkjqpecqwbsoyv.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1dWN3eGRranFwZWNxd2Jzb3l2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjU4MTksImV4cCI6MjEwMzA0MTgxOX0.UPQ7jf3C_9DX9Jr1y-g6JIxBe2EHOlMAn4CZZyQgLDQ';
  const $ = id => document.getElementById(id);

  const menuToggle  = $('menuToggle');
  const menuDrawer  = $('menuDrawer');
  const menuOverlay = $('menuOverlay');
  const menuClose   = $('menuClose');
  const headerLink  = $('headerAccountLink');
  const menuLink    = $('menuAccountLink');
  const menuText    = $('menuAccountText');
  const menuIcon    = $('menuAccountIcon');

  let client = null;
  if (typeof supabase !== 'undefined') { try { client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON); } catch(e){} }
  let user = null;

  function openDrawer() {
    menuDrawer.classList.add('open');
    menuOverlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    document.body.classList.add('menu-open');
  }
  function closeDrawer() {
    menuDrawer.classList.remove('open');
    menuOverlay.classList.remove('open');
    document.body.style.overflow = '';
    document.body.classList.remove('menu-open');
  }

  if (menuToggle)  menuToggle.addEventListener('click', openDrawer);
  if (menuClose)   menuClose.addEventListener('click', closeDrawer);
  if (menuOverlay) menuOverlay.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

  async function updateAccountUI() {
    if (!client) return;
    const { data } = await client.auth.getSession();
    const session = data && data.session;
    user = session ? session.user : null;
    if (user) {
      if (menuLink) { menuLink.setAttribute('href', 'javascript:void(0)'); menuLink.classList.add('account-active'); }
      if (menuText) menuText.textContent = 'My Account';
      if (menuIcon) menuIcon.textContent = '👤';
      if (headerLink) { headerLink.setAttribute('href', 'javascript:void(0)'); headerLink.setAttribute('aria-label', 'My Account'); }
    } else {
      if (menuLink) { menuLink.setAttribute('href', 'login.html'); menuLink.classList.remove('account-active'); }
      if (menuText) menuText.textContent = 'Login / Account';
      if (menuIcon) menuIcon.textContent = '👤';
      if (headerLink) { headerLink.setAttribute('href', 'login.html'); headerLink.setAttribute('aria-label', 'Login'); }
    }
  }
  updateAccountUI();
  if (client) client.auth.onAuthStateChange(() => setTimeout(updateAccountUI, 0));

  function friendlyName(u) {
    const meta = u.user_metadata || {};
    let n = meta.full_name || meta.name || meta.display_name || '';
    if (!n && u.is_anonymous) n = 'Guest User';
    if (!n && u.email) { const l = u.email.split('@')[0].replace(/[._-]+/g,' ').trim(); n = l.replace(/\b\w/g, c => c.toUpperCase()); }
    return n;
  }
  function providerText(u) {
    if (u.is_anonymous) return 'Guest account';
    const p = (u.app_metadata && u.app_metadata.provider) || '';
    if (p === 'google') return 'Signed in with Google';
    if (p === 'phone') return 'Signed in with Mobile OTP';
    return 'Signed in with Email & Password';
  }

  async function openProfile() {
    try { const { data } = await client.auth.getUser(); if (data && data.user) user = data.user; } catch(e){}
    if (!user) { window.location.href = 'login.html'; return; }
    const meta = user.user_metadata || {};
    $('jbProfileEmail').value = user.is_anonymous ? 'Guest account' : (user.email || '');
    $('jbProfileName').value = friendlyName(user);
    $('jbProfileMobile').value = meta.mobile || meta.phone || '';
    $('jbProfileAddress').value = meta.address || '';
    $('jbProfileProvider').textContent = providerText(user);
    $('jbProfileStatus').textContent = '';
    $('jbProfileModal').classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  function closeProfile() {
    $('jbProfileModal').classList.remove('show');
    document.body.style.overflow = '';
  }

  if (headerLink) headerLink.addEventListener('click', e => {
    e.preventDefault();
    if (!user) { window.location.href = 'login.html'; return; }
    openProfile();
  });
  if (menuLink) menuLink.addEventListener('click', e => {
    e.preventDefault();
    if (!user) { window.location.href = 'login.html'; return; }
    closeDrawer();
    setTimeout(openProfile, 300);
  });
  if ($('jbProfileClose')) $('jbProfileClose').addEventListener('click', closeProfile);
  if ($('jbProfileModal')) $('jbProfileModal').addEventListener('click', e => { if (e.target === $('jbProfileModal')) closeProfile(); });

  if ($('jbProfileSave')) {
    $('jbProfileSave').addEventListener('click', async function() {
      const n = $('jbProfileName').value.trim();
      const m = $('jbProfileMobile').value.trim();
      const a = $('jbProfileAddress').value.trim();
      if (m && !/^[0-9]{10}$/.test(m)) { $('jbProfileStatus').textContent = 'Please enter a valid 10-digit mobile number.'; return; }
      $('jbProfileSave').disabled = true; $('jbProfileSave').textContent = 'Saving...';
      const { data, error } = await client.auth.updateUser({ data: { full_name: n, name: n, mobile: m, address: a, profile_completed: true } });
      $('jbProfileSave').disabled = false; $('jbProfileSave').textContent = 'Save Profile';
      if (error) { $('jbProfileStatus').textContent = error.message; return; }
      if (data && data.user) user = data.user;
      $('jbProfileStatus').textContent = '✓ Profile saved successfully';
      setTimeout(closeProfile, 700);
    });
  }
  if ($('jbProfileLogout')) {
    $('jbProfileLogout').addEventListener('click', async function() {
      await client.auth.signOut();
      closeProfile();
      window.location.href = 'login.html';
    });
  }

  function refreshBadges() {
    try {
      const cartKeys = ['cart','jb_cart','jbstore_cart','jbCart','cartItems'];
      let cartQty = 0;
      for (const k of cartKeys) {
        const raw = localStorage.getItem(k);
        if (raw) { const v = JSON.parse(raw); if (Array.isArray(v)) { cartQty = v.reduce((s,i)=>s+(Number(i.qty||i.quantity||1)),0); break; } }
      }
      document.querySelectorAll('.cart-badge,#cartBadge,#menuCartBadge').forEach(el => { el.textContent = cartQty; el.style.display = cartQty > 0 ? 'flex' : 'none'; });

      const favKeys = ['favorites','jb_favorites','favoritesList','jbFav'];
      let favCount = 0;
      for (const k of favKeys) {
        const raw = localStorage.getItem(k);
        if (raw) { const v = JSON.parse(raw); if (Array.isArray(v)) { favCount = v.length; break; } }
      }
      document.querySelectorAll('.fav-badge,#favBadge,#menuFavBadge').forEach(el => { el.textContent = favCount; el.style.display = favCount > 0 ? 'flex' : 'none'; });
    } catch(e){}
  }
  refreshBadges();
  setInterval(refreshBadges, 1500);
})();
</script>
