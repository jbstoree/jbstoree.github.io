<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Your Cart | JB STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        /* ================================================================
           JB STORE PREMIUM LIGHT THEME – CART PAGE
           Colors: Gold #D4AF37, BG #F7F5F0, White #FFFFFF, Dark #1C1C1C
           ================================================================ */

        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            font-family: 'Poppins', sans-serif;
            background: #F7F5F0;
            color: #1C1C1C;
            padding-bottom: 100px;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
        }
        button {
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
        }

        /* ---------- HEADER ---------- */
        .header {
            background: #FFFFFF;
            padding: 12px 18px 14px;
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
            border-bottom: 1px solid rgba(212, 175, 55, 0.20);
            box-shadow: 0 2px 30px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #D4AF37;
            letter-spacing: 1px;
            text-decoration: none;
            flex-shrink: 0;
        }
        .logo span {
            color: #1C1C1C;
        }

        .search {
            display: flex;
            align-items: center;
            background: #F2EFEA;
            border: 1px solid #E3DDD2;
            border-radius: 50px;
            overflow: visible;
            position: relative;
            width: 100%;
            transition: border-color 0.3s ease;
        }
        .search:focus-within {
            border-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.04);
        }
        .search input {
            flex: 1;
            height: 44px;
            padding: 0 18px;
            background: none;
            border: none;
            color: #1C1C1C;
            outline: none;
            font-size: 14px;
            font-family: "Poppins", sans-serif;
        }
        .search input::placeholder {
            color: #9A958A;
            font-weight: 400;
        }
        .search button {
            width: 50px;
            height: 44px;
            background: #D4AF37;
            border: none;
            border-radius: 0 50px 50px 0;
            cursor: pointer;
            font-size: 18px;
            color: #FFFFFF;
            transition: all 0.3s ease;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .search button:hover {
            background: #C9A030;
            transform: scale(1.02);
        }

        .search-suggestions {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: #FFFFFF;
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 16px;
            max-height: 350px;
            overflow-y: auto;
            display: none;
            z-index: 9999;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            padding: 8px 0;
        }
        .search-suggestions.show {
            display: block;
            animation: slideDown 0.25s ease;
        }
        @keyframes slideDown {
            0% {
                opacity: 0;
                transform: translateY(-10px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .search-suggestion {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
        }
        .search-suggestion:last-child {
            border-bottom: none;
        }
        .search-suggestion:hover {
            background: rgba(212, 175, 55, 0.06);
        }
        .search-suggestion img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border-radius: 8px;
            background: #F2EFEA;
            flex-shrink: 0;
            padding: 4px;
        }
        .search-suggestion .suggestion-info {
            flex: 1;
            min-width: 0;
        }
        .search-suggestion .suggestion-name {
            color: #1C1C1C;
            font-size: 14px;
            font-weight: 600;
        }
        .search-suggestion .suggestion-name strong {
            color: #D4AF37;
        }
        .search-suggestion .suggestion-category {
            color: #8A8580;
            font-size: 12px;
            margin-top: 2px;
        }
        .search-suggestion .suggestion-arrow {
            color: #D4AF37;
            font-size: 16px;
            opacity: 0;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }
        .search-suggestion:hover .suggestion-arrow {
            opacity: 1;
            transform: translateX(4px);
        }
        .search-no-result {
            padding: 30px 20px;
            color: #8A8580;
            text-align: center;
            font-size: 14px;
        }

        /* ---------- CART PAGE ---------- */
        .cart-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 20px 40px;
        }

        /* Cart Header */
        .cart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
        }
        .cart-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1C1C1C;
            letter-spacing: -0.5px;
        }
        .cart-header h1 span {
            color: #D4AF37;
        }
        .cart-subtitle {
            color: #8A8580;
            font-size: 14px;
            margin-top: 2px;
        }
        .cart-count {
            background: #FFFFFF;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            color: #4A4742;
            border: 1px solid rgba(212, 175, 55, 0.25);
            white-space: nowrap;
        }

        /* Cart Items Container */
        #cartItemsContainer {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* Cart Items Grid */
        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Individual Cart Item Card */
        .cart-item {
            display: flex;
            align-items: center;
            gap: 18px;
            background: #FFFFFF;
            border-radius: 16px;
            padding: 16px 20px;
            border: 1px solid rgba(212, 175, 55, 0.20);
            transition: border 0.3s, box-shadow 0.3s;
            flex-wrap: wrap;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
        }
        .cart-item:hover {
            border-color: rgba(212, 175, 55, 0.50);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        }
        .cart-item-img {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            background: #F2EFEA;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }
        .cart-item-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 6px;
        }
        .cart-item-img .no-img {
            font-size: 30px;
            color: #B0ABA0;
        }
        .cart-item-details {
            flex: 1;
            min-width: 140px;
        }
        .cart-item-details .item-name {
            font-weight: 600;
            font-size: 16px;
            color: #1C1C1C;
            margin-bottom: 2px;
        }
        .cart-item-details .item-brand {
            font-size: 13px;
            color: #8A8580;
        }
        .cart-item-details .item-price {
            font-weight: 700;
            font-size: 18px;
            color: #D4AF37;
            margin-top: 4px;
        }
        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-left: auto;
            flex-wrap: wrap;
        }
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #F2EFEA;
            border-radius: 30px;
            padding: 2px 4px;
            border: 1px solid #E3DDD2;
        }
        .quantity-control button {
            background: transparent;
            border: none;
            color: #4A4742;
            font-size: 18px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .quantity-control button:hover {
            background: rgba(212, 175, 55, 0.10);
            color: #D4AF37;
        }
        .quantity-control .qty-num {
            min-width: 32px;
            text-align: center;
            font-weight: 600;
            font-size: 16px;
            color: #1C1C1C;
        }
        .remove-item {
            background: transparent;
            border: none;
            color: #B0ABA0;
            font-size: 18px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 30px;
            transition: background 0.2s, color 0.2s;
        }
        .remove-item:hover {
            background: rgba(255, 23, 68, 0.06);
            color: #ff1744;
        }

        /* Cart Summary */
        .cart-summary {
            background: #FFFFFF;
            border-radius: 16px;
            padding: 24px 28px;
            border: 1px solid rgba(212, 175, 55, 0.20);
            max-width: 440px;
            width: 100%;
            align-self: flex-end;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 15px;
            color: #4A4742;
        }
        .summary-row.total {
            font-size: 20px;
            font-weight: 700;
            color: #1C1C1C;
        }
        .summary-row.total strong {
            color: #D4AF37;
        }
        .summary-divider {
            height: 1px;
            background: rgba(212, 175, 55, 0.15);
            margin: 12px 0;
        }
        .summary-row strong {
            color: #1C1C1C;
        }
        .cart-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 18px;
        }
        .checkout-btn {
            background: linear-gradient(135deg, #D4AF37, #C9A030);
            border: none;
            border-radius: 30px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 700;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.20);
        }
        .checkout-btn:hover {
            background: linear-gradient(135deg, #F3CF55, #D4AF37);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(212, 175, 55, 0.30);
        }
        .checkout-btn:active {
            transform: scale(0.98);
        }
        .clear-cart-btn {
            background: transparent;
            border: 1px solid #E3DDD2;
            border-radius: 30px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 500;
            color: #8A8580;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }
        .clear-cart-btn:hover {
            background: rgba(255, 23, 68, 0.04);
            border-color: #ff1744;
            color: #ff1744;
        }

        /* Empty Cart */
        .empty-cart {
            text-align: center;
            padding: 60px 20px 40px;
            background: #FFFFFF;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
        }
        .empty-icon {
            font-size: 72px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .empty-cart h2 {
            font-size: 24px;
            font-weight: 600;
            color: #1C1C1C;
            margin-bottom: 8px;
        }
        .empty-cart p {
            color: #8A8580;
            font-size: 15px;
            margin-bottom: 28px;
        }
        .shop-now-btn {
            display: inline-block;
            background: linear-gradient(135deg, #D4AF37, #C9A030);
            color: #FFFFFF;
            font-weight: 700;
            font-size: 16px;
            padding: 14px 40px;
            border-radius: 30px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.20);
        }
        .shop-now-btn:hover {
            background: linear-gradient(135deg, #F3CF55, #D4AF37);
            transform: scale(1.03);
            box-shadow: 0 8px 32px rgba(212, 175, 55, 0.30);
        }

        /* ---------- BOTTOM BAR ---------- */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 9999;
            background: #FFFFFF;
            border-top: 2px solid rgba(212, 175, 55, 0.10);
            box-shadow: 0 -4px 40px rgba(0, 0, 0, 0.02);
            padding: 0 20px;
        }
        .bottom-container {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            padding: 10px 0;
            max-width: 600px;
            margin: 0 auto;
            gap: 10px;
        }
        .bottom-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-decoration: none;
            color: #B0ABA0;
            padding: 8px 12px;
            border-radius: 12px;
            position: relative;
            flex: 1;
            max-width: 100px;
            transition: all 0.3s ease;
            cursor: pointer;
            background: transparent;
            border: none;
            overflow: visible;
        }
        .bottom-item::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background: #D4AF37;
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        .bottom-item.active::after,
        .bottom-item:hover::after {
            width: 60%;
        }
        .bottom-icon {
            font-size: 24px;
            line-height: 1;
            transition: transform 0.3s ease;
        }
        .bottom-item:hover .bottom-icon {
            transform: translateY(-2px);
        }
        .bottom-label {
            font-size: 11px;
            font-weight: 600;
            color: #B0ABA0;
            letter-spacing: 0.3px;
            transition: color 0.3s ease;
        }
        .bottom-item.active .bottom-icon,
        .bottom-item.active .bottom-label {
            color: #D4AF37;
        }
        .bottom-item.active .bottom-icon {
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.12);
        }
        .bottom-item:hover .bottom-icon {
            color: #D4AF37;
        }
        .bottom-item:hover .bottom-label {
            color: #D4AF37;
        }

        .cart-badge,
        .fav-badge {
            position: absolute;
            top: 2px;
            right: 6px;
            font-size: 10px;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
            transform: scale(0);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .cart-badge.show,
        .fav-badge.show {
            transform: scale(1);
        }
        .cart-badge {
            background: #D4AF37;
            color: #FFFFFF;
            box-shadow: 0 2px 10px rgba(212, 175, 55, 0.25);
        }
        .fav-badge {
            background: #ff1744;
            color: #FFFFFF;
            box-shadow: 0 2px 10px rgba(255, 23, 68, 0.20);
        }

        .call-item .bottom-icon {
            color: #25D366;
        }

        /* ---------- SCROLLBAR ---------- */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F7F5F0;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.30);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 175, 55, 0.50);
        }

        .hidden {
            display: none !important;
        }

        /* ================================================================
           RESPONSIVE
           ================================================================ */

        /* Tablets & Small Laptops */
        @media (max-width: 820px) {
            .cart-page {
                padding: 18px 16px 30px;
            }
            .cart-header h1 {
                font-size: 24px;
            }
            .cart-summary {
                max-width: 100%;
                align-self: stretch;
            }
            .cart-item {
                padding: 14px 16px;
                gap: 14px;
            }
            .cart-item-img {
                width: 60px;
                height: 60px;
            }
            .cart-item-details .item-name {
                font-size: 15px;
            }
            .cart-item-details .item-price {
                font-size: 16px;
            }
        }

        /* Mobile */
        @media (max-width: 640px) {
            .header {
                padding: 10px 14px;
                gap: 8px;
            }
            .logo {
                font-size: 18px;
            }
            .search {
                width: 100%;
            }
            .search input {
                height: 38px;
                font-size: 13px;
                padding: 0 14px;
            }
            .search button {
                width: 42px;
                height: 38px;
                font-size: 16px;
            }

            .cart-page {
                padding: 14px 12px 24px;
            }
            .cart-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
            .cart-header h1 {
                font-size: 20px;
            }
            .cart-count {
                font-size: 12px;
                padding: 4px 14px;
            }

            .cart-item {
                flex-direction: row;
                padding: 12px 14px;
                gap: 12px;
                flex-wrap: wrap;
            }
            .cart-item-img {
                width: 54px;
                height: 54px;
            }
            .cart-item-details {
                min-width: 100px;
                flex: 1 1 50%;
            }
            .cart-item-details .item-name {
                font-size: 14px;
            }
            .cart-item-details .item-brand {
                font-size: 12px;
            }
            .cart-item-details .item-price {
                font-size: 15px;
            }
            .cart-item-actions {
                margin-left: 0;
                width: 100%;
                justify-content: flex-end;
                gap: 10px;
            }
            .quantity-control button {
                width: 30px;
                height: 30px;
                font-size: 16px;
            }
            .quantity-control .qty-num {
                min-width: 26px;
                font-size: 14px;
            }
            .remove-item {
                font-size: 16px;
                padding: 4px 8px;
            }

            .cart-summary {
                padding: 18px 18px;
            }
            .summary-row {
                font-size: 14px;
            }
            .summary-row.total {
                font-size: 18px;
            }
            .checkout-btn {
                padding: 12px 16px;
                font-size: 15px;
            }
            .clear-cart-btn {
                padding: 10px 16px;
                font-size: 13px;
            }

            .empty-cart {
                padding: 40px 16px 30px;
            }
            .empty-icon {
                font-size: 56px;
            }
            .empty-cart h2 {
                font-size: 20px;
            }
            .shop-now-btn {
                padding: 12px 32px;
                font-size: 15px;
            }

            .bottom-item {
                min-width: 44px;
                padding: 4px 6px;
            }
            .bottom-item .bottom-icon {
                font-size: 20px;
            }
            .bottom-item .bottom-label {
                font-size: 9px;
            }
            .cart-badge,
            .fav-badge {
                font-size: 9px;
                min-width: 16px;
                height: 16px;
                top: -4px;
                right: 0;
            }
        }

        /* Small Phones */
        @media (max-width: 400px) {
            .header {
                padding: 8px 10px;
            }
            .logo {
                font-size: 16px;
            }
            .search input {
                font-size: 12px;
                padding: 6px 10px;
                height: 34px;
            }
            .search button {
                width: 36px;
                height: 34px;
                font-size: 14px;
            }

            .cart-page {
                padding: 10px 8px 20px;
            }
            .cart-header h1 {
                font-size: 18px;
            }
            .cart-item {
                padding: 10px 10px;
                gap: 10px;
                border-radius: 12px;
            }
            .cart-item-img {
                width: 46px;
                height: 46px;
                border-radius: 8px;
            }
            .cart-item-details .item-name {
                font-size: 13px;
            }
            .cart-item-details .item-price {
                font-size: 14px;
            }
            .cart-item-actions {
                gap: 6px;
            }
            .quantity-control button {
                width: 26px;
                height: 26px;
                font-size: 14px;
            }
            .quantity-control .qty-num {
                min-width: 22px;
                font-size: 13px;
            }
            .remove-item {
                font-size: 14px;
            }

            .cart-summary {
                padding: 14px 14px;
                border-radius: 12px;
            }
            .summary-row {
                font-size: 13px;
            }
            .summary-row.total {
                font-size: 16px;
            }
            .checkout-btn {
                padding: 10px 14px;
                font-size: 14px;
            }

            .empty-cart {
                padding: 30px 12px 24px;
                border-radius: 16px;
            }
            .empty-icon {
                font-size: 44px;
            }
            .empty-cart h2 {
                font-size: 18px;
            }
            .shop-now-btn {
                padding: 10px 24px;
                font-size: 14px;
            }
        }

        /* Desktop Large */
        @media (min-width: 1200px) {
            .cart-page {
                padding: 32px 40px 50px;
            }
            .cart-items {
                gap: 20px;
            }
            .cart-item {
                padding: 20px 28px;
                border-radius: 20px;
            }
            .cart-item-img {
                width: 84px;
                height: 84px;
                border-radius: 16px;
            }
            .cart-item-details .item-name {
                font-size: 18px;
            }
            .cart-item-details .item-price {
                font-size: 20px;
            }
            .cart-summary {
                padding: 28px 34px;
                border-radius: 20px;
                max-width: 480px;
            }
            .summary-row {
                font-size: 16px;
            }
            .summary-row.total {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-top">
            <a href="index.html" class="logo">JB <span>STORE</span></a>
        </div>
        <div class="search">
            <input type="text" id="searchInput" placeholder="Search products..." autocomplete="off" />
            <button type="button" id="searchButton">🔍</button>
            <div id="searchSuggestions" class="search-suggestions"></div>
        </div>
    </header>

    <!-- ===== CART PAGE ===== -->
    <main class="cart-page">

        <!-- Cart Header -->
        <div class="cart-header">
            <div>
                <h1>🛒 Your Cart</h1>
                <p class="cart-subtitle">Review your items before checkout</p>
            </div>
            <span class="cart-count" id="cartCount">0 items</span>
        </div>

        <!-- Cart Items -->
        <div id="cartItemsContainer">
            <div id="cartItems" class="cart-items"></div>

            <!-- Cart Summary -->
            <div id="cartSummary" class="cart-summary" style="display:none;">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <strong id="cartSubtotal">₹0</strong>
                </div>
                <div class="summary-row">
                    <span>Delivery</span>
                    <strong style="color:#25D366;">Free</strong>
                </div>
                <div class="summary-divider"></div>
                <div class="summary-row total">
                    <span>Total</span>
                    <strong id="cartTotalPrice">₹0</strong>
                </div>
                <div class="cart-actions">
                    <button class="checkout-btn" onclick="checkout()">
                        <span>Proceed to Checkout</span>
                        <span>→</span>
                    </button>
                    <button class="clear-cart-btn" onclick="clearCart()">🗑️ Clear Cart</button>
                </div>
            </div>
        </div>

        <!-- Empty Cart -->
        <div id="emptyCart" class="empty-cart" style="display:block;">
            <div class="empty-icon">🛒</div>
            <h2>Your cart is empty</h2>
            <p>Browse our collection and add items you love</p>
            <a href="index.html" class="shop-now-btn">Start Shopping →</a>
        </div>

    </main>

    <!-- ===== BOTTOM BAR ===== -->
    <div class="bottom-bar">
        <div class="bottom-container">
            <a href="index.html" class="bottom-item" id="bottomHome">
                <span class="bottom-icon">🏠</span>
                <span class="bottom-label">Home</span>
            </a>
            <a href="favorites.html" class="bottom-item" id="bottomFav">
                <span class="bottom-icon" style="color:#ff1744;">❤️</span>
                <span class="fav-badge" id="favBadge">0</span>
                <span class="bottom-label" style="color:#ff1744;font-weight:700;">Favorites</span>
            </a>
            <a href="tel:919999999999" class="bottom-item call-item" id="bottomCall">
                <span class="bottom-icon">📞</span>
                <span class="bottom-label">Call</span>
            </a>
            <a href="cart.html" class="bottom-item active cart-item">
                <span class="bottom-icon">🛒</span>
                <span class="cart-badge" id="cartBadge">0</span>
                <span class="bottom-label">Cart</span>
            </a>
        </div>
    </div>

    <!-- ===== EXTERNAL SCRIPTS (your existing logic) ===== -->
    <script src="config.js"></script>

    <script src="refrigerator.js"></script>

    <script src="ac.js"></script>
    <script src="tv.js"></script>
    <script src="script.js"></script>   <!-- contains cart logic -->
    <script src="favorites.js"></script> <!-- favorites & badge updates -->

</body>
