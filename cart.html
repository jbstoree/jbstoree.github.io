<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart | JB STORE</title>

  <!-- ===== GLOBAL STYLES (Header, Menu, Footer, Bottom bar, etc.) ===== -->
  <link rel="stylesheet" href="style.css" />

  <!-- =========================================================
       CART-SPECIFIC STYLES (Separated from style.css & added here)
       ========================================================= -->
  
  <style>
    /* CART PAGE - ONLY CART ACTIVE */
#bottomHome::after {
    display: none !important;
}

#bottomHome {
    border-bottom: none !important;
    box-shadow: none !important;
}

#bottomCart::after {
    display: block !important;
}

.bottom-item:not(.active)::after {
    display: none !important;
}
    /* ==========================================
       CART PAGE — DESKTOP (min-width: 769px)
       ========================================== */

    .cart-page {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 24px;
      min-height: 60vh;
    }

    /* ——— HEADER ——— */
    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 32px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.1);
    }

    .cart-header h1 {
      color: #000000;
      font-size: 32px;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.5px;
    }

    .cart-header h1::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 32px;
      background: linear-gradient(180deg, #D4AF37, #F3CF55);
      border-radius: 4px;
      margin-right: 14px;
      vertical-align: middle;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
    }

    .cart-subtitle {
      color: #000000;
      font-size: 14px;
      margin: 4px 0 0 18px;
      font-weight: 400;
    }

    .cart-count {
      color: #000000;
      font-size: 14px;
      font-weight: 600;
      background: rgba(212, 175, 55, 0.08);
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid rgba(212, 175, 55, 0.15);
      white-space: nowrap;
    }

    /* ——— ITEMS CONTAINER ——— */
    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 32px;
    }

    /* ——— SINGLE CART ITEM ——— */
    .cart-item {
      display: flex;
      align-items: center;
      gap: 20px;
      background: #FFFFFF;
      border-radius: 16px;
      padding: 18px 24px;
      transition: all 0.3s ease;
      border: 1px solid #FFD700 !important;
      box-shadow: 0 0 3px rgba(255, 215, 0, 0.03) !important;
    }

    .cart-item:hover {
      border-color: #FFD700 !important;
      transform: translateY(-2px);
      box-shadow: 0 0 6px rgba(255, 215, 0, 0.06) !important;
    }

    .cart-item-image {
      width: 80px;
      height: 80px;
      min-width: 80px;
      background: #FFFFFF;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .cart-item-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .cart-item-info {
      flex: 1;
      min-width: 0;
    }

    .cart-item-info h3 {
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 4px 0;
      line-height: 1.3;
    }

    .cart-item-brand {
      color: #000000;
      font-size: 13px;
      margin: 0 0 4px 0;
    }

    .cart-item-price {
      color: #000000;
      font-size: 18px;
      font-weight: 700;
      margin: 0;
    }

    /* ——— QUANTITY ——— */
    .cart-item-qty {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 4px 8px;
    }

    .qty-btn {
      background: transparent;
      border: none;
      color: #D4AF37;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 6px;
      transition: all 0.3s ease;
      font-weight: 600;
    }

    .qty-btn:hover {
      background: rgba(212, 175, 55, 0.1);
    }

    .qty-number {
      color: #FFFFFF;
      font-weight: 600;
      font-size: 16px;
      min-width: 30px;
      text-align: center;
    }

    .cart-item-total {
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 600;
      min-width: 100px;
      text-align: right;
    }

    /* ——— REMOVE BUTTON ——— */
    .remove-btn {
      background: rgba(255, 0, 0, 0.06);
      border: 1px solid rgba(255, 0, 0, 0.1);
      color: #FF4444;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .remove-btn:hover {
      background: rgba(255, 0, 0, 0.15);
      transform: scale(1.05);
    }

    /* ——— SUMMARY ——— */
    .cart-summary {
      background: #FFFFFF;
      border: 1px solid rgba(212, 175, 55, 0.08);
      border-radius: 16px;
      padding: 28px 32px;
      max-width: 420px;
      margin-left: auto;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
    }

    .summary-row span {
      color: #000000;
      font-size: 15px;
    }

    .summary-row strong {
      color: #FFFFFF;
      font-size: 17px;
      font-weight: 600;
    }

    .summary-row.total {
      padding-top: 14px;
    }

    .summary-row.total span {
      font-size: 17px;
      font-weight: 600;
      color: #FFFFFF;
    }

    .summary-row.total strong {
      color: #000000;
      font-size: 26px;
      font-weight: 700;
    }

    .summary-divider {
      height: 1px;
      background: linear-gradient(90deg, rgba(212, 175, 55, 0.15), transparent);
      margin: 10px 0 14px;
    }

    /* ——— ACTIONS ——— */
    .cart-actions {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .checkout-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      height: 54px;
      background: linear-gradient(135deg, #D4AF37, #F3CF55);
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      color: #000000;
      cursor: pointer;
      transition: all 0.3s ease;
      padding: 0 28px;
    }

    .checkout-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(212, 175, 55, 0.3);
    }

    .checkout-btn span:last-child {
      font-size: 20px;
    }

    .clear-cart-btn {
      width: 100%;
      height: 46px;
      background: transparent;
      border: 1px solid rgba(255, 0, 0, 0.15);
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      color: #FF4444;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .clear-cart-btn:hover {
      background: rgba(255, 0, 0, 0.05);
      border-color: rgba(255, 0, 0, 0.25);
    }

    /* ——— EMPTY CART ——— */
    .empty-cart {
      text-align: center;
      padding: 100px 20px;
      background: #FFFFFF;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .empty-icon {
      font-size: 72px;
      margin-bottom: 20px;
      display: block;
    }

    .empty-cart h2 {
      color: #FFFFFF;
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 10px 0;
    }

    .empty-cart p {
      color: #000000;
      font-size: 15px;
      margin: 0 0 28px 0;
    }

    .shop-now-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #D4AF37, #F3CF55);
      color: #000000;
      padding: 16px 40px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .shop-now-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(212, 175, 55, 0.3);
    }

    /* ===== CART BADGE (Bottom Bar) ===== */
    .bottom-item .cart-badge {
      position: absolute;
      top: 2px;
      right: 6px;
      background: #D4AF37;
      color: #000;
      font-size: 10px;
      font-weight: 700;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
      z-index: 10;
      pointer-events: none;
    }


    /* ==========================================
       MOBILE CART STYLES (max-width: 768px)
       ========================================== */
    @media (max-width: 768px) {

      .cart-page {
        padding: 0 12px;
        margin: 16px auto;
        min-height: 50vh;
      }

      /* ——— HEADER ——— */
      .cart-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        margin-bottom: 18px;
        padding-bottom: 14px;
      }

      .cart-header h1 {
        font-size: 22px;
      }

      .cart-header h1::before {
        height: 22px;
        width: 3px;
        margin-right: 10px;
      }

      .cart-subtitle {
        font-size: 12px;
        margin: 2px 0 0 13px;
      }

      .cart-count {
        font-size: 12px;
        padding: 4px 14px;
        border-radius: 16px;
        align-self: flex-start;
      }

      /* ——— ITEMS ——— */
      .cart-items {
        gap: 10px;
        margin-bottom: 20px;
      }

      .cart-item {
        flex-wrap: wrap;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 14px;
        border: 0.6px solid #FFD700 !important;
      }

      .cart-item-image {
        width: 55px;
        height: 55px;
        min-width: 55px;
        padding: 6px;
      }

      .cart-item-info h3 {
        font-size: 13px;
      }
      .cart-item-brand {
        font-size: 11px;
      }
      .cart-item-price {
        font-size: 14px;
      }

      .cart-item-qty {
        gap: 4px;
        padding: 2px 4px;
        margin-left: auto;
      }
      .qty-btn {
        font-size: 16px;
        padding: 2px 8px;
      }
      .qty-number {
        font-size: 14px;
        min-width: 22px;
      }

      .cart-item-total {
        font-size: 14px;
        width: 100%;
        text-align: right;
        padding-top: 4px;
        border-top: 1px solid rgba(255, 255, 255, 0.04);
      }

      .remove-btn {
        width: 28px;
        height: 28px;
        font-size: 12px;
      }

      /* ——— SUMMARY ——— */
      .cart-summary {
        padding: 18px 16px;
        max-width: 100%;
        margin: 0;
      }

      .summary-row span {
        font-size: 13px;
      }
      .summary-row strong {
        font-size: 14px;
      }
      .summary-row.total strong {
        font-size: 22px;
      }

      .checkout-btn {
        height: 48px;
        font-size: 14px;
        padding: 0 18px;
      }
      .clear-cart-btn {
        height: 40px;
        font-size: 13px;
      }

      /* ——— EMPTY CART ——— */
      .empty-cart {
        padding: 50px 16px;
      }
      .empty-icon {
        font-size: 50px;
      }
      .empty-cart h2 {
        font-size: 20px;
      }
      .empty-cart p {
        font-size: 13px;
      }
      .shop-now-btn {
        padding: 12px 28px;
        font-size: 14px;
      }
    }
  </style>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="header">
  <a href="index.html" class="logo">JB <span>STORE</span></a>
  <div class="search">
    <input type="text" id="searchInput" placeholder="Search products..." autocomplete="off">
    <button type="button" id="searchButton">🔍</button>
    <div id="searchSuggestions" class="search-suggestions"></div>
  </div>
</header>

<!-- ===== CART PAGE ===== -->
<main class="cart-page">

  <!-- Cart Header -->
  <div class="cart-header">
    <div>
      <h1>🛒 Your Cart</h1>
      <p class="cart-subtitle">Review your items before checkout</p>
    </div>
    <span class="cart-count" id="cartCount">0 items</span>
  </div>

  <!-- Cart Items -->
  <div id="cartItemsContainer">
    <div id="cartItems" class="cart-items"></div>

    <!-- Cart Summary -->
    <div id="cartSummary" class="cart-summary" style="display:none;">
      <div class="summary-row">
        <span>Subtotal</span>
        <strong id="cartSubtotal">₹0</strong>
      </div>
      <div class="summary-row">
        <span>Delivery</span>
        <strong style="color:#FF0000;">Free</strong>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-row total">
        <span>Total</span>
        <strong id="cartTotalPrice">₹0</strong>
      </div>
      <div class="cart-actions">
        <button class="checkout-btn" onclick="checkout()">
          <span>Proceed to Checkout</span>
          <span>→</span>
        </button>
        <button class="clear-cart-btn" onclick="clearCart()">🗑️ Clear Cart</button>
      </div>
    </div>
  </div>

  <!-- Empty Cart -->
  <div id="emptyCart" class="empty-cart" style="display:block;">
    <div class="empty-icon">🛒</div>
    <h2>Your cart is empty</h2>
    <p>Browse our collection and add items you love</p>
    <a href="index.html" class="shop-now-btn">Start Shopping →</a>
  </div>

</main>

<!-- ===== BOTTOM BAR ===== -->
<div class="bottom-bar">
  <div class="bottom-container">
    <a href="index.html" class="bottom-item" id="bottomHome">
      <span class="bottom-icon">🏠</span>
      <span class="bottom-label">Home</span>
    </a>
    <a href="favorites.html" class="bottom-item" id="bottomFav">
      <span class="bottom-icon" style="color:#ff1744;">❤️</span>
      <span class="fav-badge" id="favBadge">0</span>
      <span class="bottom-label" style="color:#ff1744;font-weight:700;">Favorites</span>
    </a>
    <a href="tel:919999999999" class="bottom-item call-item" id="bottomCall">
      <span class="bottom-icon">📞</span>
      <span class="bottom-label">Call</span>
    </a>
    <a href="cart.html" class="bottom-item cart-item active" id="bottomCart">
      <span class="bottom-icon">🛒</span>
      <span class="cart-badge" id="cartBadge">0</span>
      <span class="bottom-label">Cart</span>
    </a>
  </div>
</div>

<!-- ===== SCRIPTS ===== -->
<script src="config.js"></script>
<script src="mobiles.js"></script>
<script src="refrigerator.js"></script>
<script src="washing.js"></script>
<script src="ac.js"></script>
<script src="tv.js"></script>
<script src="script.js"></script>
<script src="favorites.js"></script>
</body>
</html>
