<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Your Cart | JB STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            font-family: 'Poppins', sans-serif;
            background: #F7F5F0;
            color: #1C1C1C;
            padding-bottom: 100px;
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        .header {
            background: #FFFFFF;
            padding: 14px 20px 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(212, 175, 55, 0.20);
            box-shadow: 0 2px 30px rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: #D4AF37;
            text-decoration: none;
            letter-spacing: 1px;
        }
        .logo span {
            color: #1C1C1C;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-back {
            color: #1C1C1C;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.3s ease;
        }
        .header-back:hover {
            color: #D4AF37;
        }
        .header-back i {
            font-size: 18px;
        }

        /* ===== CART PAGE ===== */
        .cart-page {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px 20px 40px;
            width: 100%;
            flex: 1;
        }

        /* -- Cart Header -- */
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 2px solid rgba(212, 175, 55, 0.10);
        }

        .cart-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1C1C1C;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .cart-header h1 i {
            color: #D4AF37;
            font-size: 26px;
        }

        .cart-subtitle {
            color: #8A8580;
            font-size: 14px;
            font-weight: 400;
            margin-top: 2px;
        }

        .cart-count {
            background: rgba(212, 175, 55, 0.08);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            color: #D4AF37;
            border: 1px solid rgba(212, 175, 55, 0.15);
            white-space: nowrap;
        }

        /* ===== EMPTY CART ===== */
        .empty-cart {
            display: none;
            text-align: center;
            padding: 70px 20px 60px;
            background: #FFFFFF;
            border-radius: 24px;
            border: 1px solid rgba(212, 175, 55, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.02);
        }

        .empty-cart.show {
            display: block;
            animation: fadeUp 0.5s ease;
        }

        .empty-icon {
            font-size: 72px;
            margin-bottom: 20px;
            display: inline-block;
            opacity: 0.6;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .empty-cart h2 {
            font-size: 24px;
            font-weight: 700;
            color: #1C1C1C;
            margin-bottom: 8px;
        }

        .empty-cart p {
            color: #8A8580;
            font-size: 15px;
            margin-bottom: 28px;
        }

        .shop-now-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #D4AF37, #C9A030);
            color: #FFFFFF;
            padding: 14px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 25px rgba(212, 175, 55, 0.20);
            border: none;
            cursor: pointer;
        }
        .shop-now-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 35px rgba(212, 175, 55, 0.25);
        }
        .shop-now-btn:active {
            transform: scale(0.97);
        }

        /* ===== CART ITEMS ===== */
        .cart-items-container {
            display: none;
            animation: fadeUp 0.5s ease;
        }

        .cart-items-container.show {
            display: block;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 28px;
        }

        /* -- Individual Cart Item -- */
        .cart-item {
            display: flex;
            align-items: center;
            gap: 18px;
            background: #FFFFFF;
            border-radius: 18px;
            padding: 16px 18px;
            border: 1px solid rgba(212, 175, 55, 0.10);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.02);
            transition: all 0.3s ease;
            position: relative;
        }

        .cart-item:hover {
            border-color: rgba(212, 175, 55, 0.25);
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.04);
        }

        .cart-item-img {
            width: 80px;
            height: 80px;
            flex-shrink: 0;
            background: #F2EFEA;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
        }
        .cart-item-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .cart-item-info {
            flex: 1;
            min-width: 0;
        }

        .cart-item-name {
            font-size: 15px;
            font-weight: 600;
            color: #1C1C1C;
            margin-bottom: 2px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .cart-item-brand {
            font-size: 12px;
            color: #8A8580;
            margin-bottom: 4px;
        }

        .cart-item-price {
            font-size: 17px;
            font-weight: 700;
            color: #D4AF37;
        }

        .cart-item-old-price {
            font-size: 13px;
            color: #B0ABA0;
            text-decoration: line-through;
            margin-left: 8px;
            font-weight: 400;
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .qty-control {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #F2EFEA;
            border-radius: 30px;
            padding: 3px 4px;
            border: 1px solid rgba(212, 175, 55, 0.10);
        }

        .qty-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: #1C1C1C;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
        }
        .qty-btn:hover {
            background: rgba(212, 175, 55, 0.10);
            color: #D4AF37;
        }
        .qty-btn:active {
            transform: scale(0.90);
        }

        .qty-value {
            min-width: 28px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: #1C1C1C;
        }

        .remove-btn {
            background: transparent;
            border: none;
            color: #B0ABA0;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .remove-btn:hover {
            color: #ff1744;
            background: rgba(255, 23, 68, 0.06);
        }
        .remove-btn:active {
            transform: scale(0.85);
        }

        /* ===== CART SUMMARY ===== */
        .cart-summary {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 24px 28px;
            border: 1px solid rgba(212, 175, 55, 0.10);
            box-shadow: 0 2px 30px rgba(0, 0, 0, 0.02);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }

        .summary-row span {
            color: #4A4742;
            font-size: 15px;
        }

        .summary-row strong {
            font-size: 16px;
            font-weight: 600;
            color: #1C1C1C;
        }

        .summary-row.total {
            padding-top: 16px;
            border-top: 2px solid rgba(212, 175, 55, 0.10);
            margin-top: 4px;
        }
        .summary-row.total span {
            font-size: 18px;
            font-weight: 700;
            color: #1C1C1C;
        }
        .summary-row.total strong {
            font-size: 22px;
            font-weight: 800;
            color: #D4AF37;
        }

        .summary-divider {
            height: 1px;
            background: rgba(212, 175, 55, 0.08);
            margin: 6px 0 10px;
        }

        .cart-actions {
            display: flex;
            gap: 14px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .checkout-btn {
            flex: 1;
            min-width: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, #D4AF37, #C9A030);
            color: #FFFFFF;
            padding: 16px 28px;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 25px rgba(212, 175, 55, 0.20);
            font-family: 'Poppins', sans-serif;
        }
        .checkout-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 35px rgba(212, 175, 55, 0.25);
        }
        .checkout-btn:active {
            transform: scale(0.97);
        }
        .checkout-btn span:last-child {
            font-size: 20px;
            transition: transform 0.3s ease;
        }
        .checkout-btn:hover span:last-child {
            transform: translateX(4px);
        }

        .clear-cart-btn {
            padding: 16px 24px;
            background: transparent;
            border: 2px solid rgba(212, 175, 55, 0.15);
            border-radius: 50px;
            color: #4A4742;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .clear-cart-btn:hover {
            border-color: #ff1744;
            color: #ff1744;
            background: rgba(255, 23, 68, 0.04);
        }
        .clear-cart-btn:active {
            transform: scale(0.95);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            background: #1C1C1C;
            color: #FFFFFF;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            z-index: 99999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 90%;
            white-space: nowrap;
        }
        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
        .toast i {
            color: #D4AF37;
            font-size: 18px;
        }

        /* ===== BOTTOM BAR ===== */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 999;
            background: #FFFFFF;
            border-top: 2px solid rgba(212, 175, 55, 0.10);
            box-shadow: 0 -4px 40px rgba(0, 0, 0, 0.02);
            padding: 8px 20px;
        }

        .bottom-container {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            max-width: 500px;
            margin: 0 auto;
            gap: 4px;
        }

        .bottom-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            text-decoration: none;
            color: #B0ABA0;
            padding: 6px 12px;
            border-radius: 12px;
            position: relative;
            flex: 1;
            max-width: 80px;
            transition: all 0.3s ease;
            border: none;
            background: transparent;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }

        .bottom-item.active {
            color: #D4AF37;
        }
        .bottom-item.active .bottom-label {
            color: #D4AF37;
        }

        .bottom-icon {
            font-size: 22px;
            transition: transform 0.3s ease;
        }
        .bottom-item:hover .bottom-icon {
            transform: translateY(-2px);
        }

        .bottom-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: color 0.3s ease;
        }

        .cart-badge {
            position: absolute;
            top: 0;
            right: 4px;
            background: linear-gradient(135deg, #D4AF37, #F3CF55);
            color: #FFFFFF;
            font-size: 10px;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(212, 175, 55, 0.15);
            transition: all 0.3s ease;
        }

        .fav-badge {
            position: absolute;
            top: 0;
            right: 4px;
            background: #ff1744;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(255, 23, 68, 0.15);
        }

        .call-item .bottom-icon {
            background: linear-gradient(135deg, #25D366, #1DA851);
            padding: 8px;
            border-radius: 50%;
            font-size: 18px;
            color: #FFFFFF;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.10);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .cart-page {
                padding: 16px 12px 30px;
            }

            .cart-header h1 {
                font-size: 22px;
            }
            .cart-header h1 i {
                font-size: 20px;
            }
            .cart-subtitle {
                font-size: 13px;
            }
            .cart-count {
                font-size: 12px;
                padding: 4px 14px;
            }

            .cart-item {
                padding: 12px 14px;
                gap: 12px;
                flex-wrap: wrap;
            }
            .cart-item-img {
                width: 60px;
                height: 60px;
            }
            .cart-item-name {
                font-size: 13px;
            }
            .cart-item-price {
                font-size: 15px;
            }
            .cart-item-actions {
                width: 100%;
                justify-content: flex-end;
                margin-top: 2px;
            }

            .qty-btn {
                width: 28px;
                height: 28px;
                font-size: 14px;
            }
            .qty-value {
                min-width: 24px;
                font-size: 14px;
            }

            .cart-summary {
                padding: 18px 16px;
            }
            .summary-row.total strong {
                font-size: 19px;
            }

            .cart-actions {
                flex-direction: column;
            }
            .checkout-btn {
                min-width: unset;
                padding: 14px 20px;
                font-size: 15px;
            }
            .clear-cart-btn {
                padding: 12px 20px;
                font-size: 13px;
                justify-content: center;
            }

            .empty-cart {
                padding: 50px 16px 40px;
            }
            .empty-icon {
                font-size: 56px;
            }
            .empty-cart h2 {
                font-size: 20px;
            }
            .shop-now-btn {
                padding: 12px 32px;
                font-size: 14px;
            }

            .bottom-container {
                gap: 2px;
            }
            .bottom-item {
                max-width: 64px;
                padding: 4px 8px;
            }
            .bottom-icon {
                font-size: 19px;
            }
            .bottom-label {
                font-size: 9px;
            }
            .cart-badge,
            .fav-badge {
                width: 18px;
                height: 18px;
                font-size: 9px;
                right: 2px;
            }
            .call-item .bottom-icon {
                font-size: 16px;
                padding: 6px;
            }

            .toast {
                font-size: 13px;
                padding: 12px 20px;
                bottom: 100px;
            }
        }

        @media (max-width: 400px) {
            .cart-item {
                flex-direction: column;
                align-items: stretch;
            }
            .cart-item-img {
                width: 100%;
                height: 120px;
            }
            .cart-item-actions {
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <a href="index.html" class="logo">JB <span>STORE</span></a>
        <div class="header-right">
            <a href="index.html" class="header-back"><i class="fas fa-arrow-left"></i> Continue</a>
        </div>
    </header>

    <!-- ===== CART PAGE ===== -->
    <main class="cart-page">

        <!-- Cart Header -->
        <div class="cart-header">
            <div>
                <h1><i class="fas fa-shopping-cart"></i> Your Cart</h1>
                <p class="cart-subtitle">Review your items before checkout</p>
            </div>
            <span class="cart-count" id="cartCount">0 items</span>
        </div>

        <!-- ===== EMPTY CART ===== -->
        <div class="empty-cart show" id="emptyCart">
            <div class="empty-icon">🛒</div>
            <h2>Your cart is empty</h2>
            <p>Browse our collection and add items you love</p>
            <a href="index.html" class="shop-now-btn">Start Shopping <i class="fas fa-arrow-right"></i></a>
        </div>

        <!-- ===== CART ITEMS + SUMMARY ===== -->
        <div class="cart-items-container" id="cartContainer">
            <div class="cart-items" id="cartItems"></div>

            <div class="cart-summary" id="cartSummary">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <strong id="cartSubtotal">₹0</strong>
                </div>
                <div class="summary-row">
                    <span>Delivery</span>
                    <strong style="color:#4ECDC4;">Free</strong>
                </div>
                <div class="summary-divider"></div>
                <div class="summary-row total">
                    <span>Total</span>
                    <strong id="cartTotalPrice">₹0</strong>
                </div>
                <div class="cart-actions">
                    <button class="checkout-btn" onclick="handleCheckout()">
                        <span>Proceed to Checkout</span>
                        <span>→</span>
                    </button>
                    <button class="clear-cart-btn" onclick="clearCart()">
                        <i class="fas fa-trash-alt"></i> Clear Cart
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- ===== BOTTOM BAR ===== -->
    <div class="bottom-bar">
        <div class="bottom-container">
            <a href="index.html" class="bottom-item">
                <span class="bottom-icon">🏠</span>
                <span class="bottom-label">Home</span>
            </a>
            <a href="favorites.html" class="bottom-item">
                <span class="bottom-icon" style="color:#ff1744;">❤️</span>
                <span class="fav-badge" id="favBadge">0</span>
                <span class="bottom-label" style="color:#ff1744;font-weight:700;">Favorites</span>
            </a>
            <a href="tel:919999999999" class="bottom-item call-item">
                <span class="bottom-icon">📞</span>
                <span class="bottom-label">Call</span>
            </a>
            <a href="cart.html" class="bottom-item active">
                <span class="bottom-icon">🛒</span>
                <span class="cart-badge" id="cartBadge">0</span>
                <span class="bottom-label">Cart</span>
            </a>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg">Added to cart</span></div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT – All cart logic embedded                        -->

            } catch {
                return [];
            }
        }

        function saveCart(cart) {
            localStorage.setItem(CART_KEY, JSON.stringify(cart));
        }

            id: 5,
            name: '4K Smart TV 55"',
            brand: 'Sony',
            price: 64999,
            oldPrice: 74999,
            image: 'https://via.placeholder.com/200/2a2a2a/D4AF37?text=TV'
        }];

        // ============================================================
        // RENDER CART
        // ============================================================

        function renderCart() {
            const cart = getCart();
            const emptyCart = document.getElementById('emptyCart');
            const container = document.getElementById('cartContainer');
            const itemsEl = document.getElementById('cartItems');
            const countEl = document.getElementById('cartCount');
            const badgeEl = document.getElementById('cartBadge');
            const subtotalEl = document.getElementById('cartSubtotal');
            const totalEl = document.getElementById('cartTotalPrice');

            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);

            // Update count & badge
            countEl.textContent = totalItems + ' item' + (totalItems !== 1 ? 's' : '');
            badgeEl.textContent = totalItems;
            badgeEl.style.display = totalItems > 0 ? 'flex' : 'none';

            if (cart.length === 0) {
                emptyCart.classList.add('show');
                container.classList.remove('show');
                return;
            }

            emptyCart.classList.remove('show');
            container.classList.add('show');

            // Build items HTML
            let html = '';
            let subtotal = 0;

            cart.forEach((item, index) => {
                // Try to find product details from sampleProducts, or use cart data
                const product = sampleProducts.find(p => p.id === item.id);
                const name = product ? product.name : (item.name || 'Product');
                const brand = product ? product.brand : (item.brand || '');
                const price = product ? product.price : (item.price || 0);
                const oldPrice = product ? product.oldPrice : (item.oldPrice || 0);
                const image = product ? product.image : (item.image || 'https://via.placeholder.com/200/2a2a2a/D4AF37?text=Product');
                const qty = item.qty || 1;
                const itemTotal = price * qty;
                subtotal += itemTotal;

                // Build variant display if present
                let variantDisplay = '';
                if (item.variant && item.variant !== 'Default') {
                    variantDisplay = `<span style="font-size:11px;color:#8A8580;display:block;">${item.variant}</span>`;
                }

                html += `
                            <div class="cart-item" data-index="${index}">
                                <div class="cart-item-img">
                                    <img src="${image}" alt="${name}" loading="lazy" onerror="this.src='https://via.placeholder.com/200/2a2a2a/D4AF37?text=Product'">
                                </div>
                                <div class="cart-item-info">
                                    <div class="cart-item-name">${name}</div>
                                    <div class="cart-item-brand">${brand}</div>
                                    ${variantDisplay}
                                    <div>
                                        <span class="cart-item-price">₹${price.toLocaleString()}</span>
                                        ${oldPrice > price ? `<span class="cart-item-old-price">₹${oldPrice.toLocaleString()}</span>` : ''}
                                    </div>
                                </div>
                                <div class="cart-item-actions">
                                    <div class="qty-control">
                                        <button class="qty-btn" onclick="updateQty(${index}, -1)">−</button>
                                        <span class="qty-value">${qty}</span>
                                        <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
                                    </div>
                                    <button class="remove-btn" onclick="removeItem(${index})" title="Remove">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                            </div>
                        `;
            });

            itemsEl.innerHTML = html;

            // Update summary
            subtotalEl.textContent = '₹' + subtotal.toLocaleString();
            totalEl.textContent = '₹' + subtotal.toLocaleString();
        }

        // ============================================================
        // CART ACTIONS
        // ============================================================

        function updateQty(index, delta) {
            const cart = getCart();
            if (!cart[index]) return;
            const newQty = cart[index].qty + delta;
            if (newQty <= 0) {
                cart.splice(index, 1);
            } else {
                cart[index].qty = newQty;
            }
            saveCart(cart);
            renderCart();
            showToast('Cart updated');
        }

        function removeItem(index) {
            const cart = getCart();
            const item = cart[index];
            const name = item ? (item.name || 'Item') : 'Item';
            cart.splice(index, 1);
            saveCart(cart);
            renderCart();
            showToast(name + ' removed');
        }

        function clearCart() {
            if (getCart().length === 0) return;
            if (confirm('Are you sure you want to clear your cart?')) {
                saveCart([]);
                renderCart();
                showToast('Cart cleared');
            }
        }

        function handleCheckout() {
            const cart = getCart();
            if (cart.length === 0) {
                showToast('Your cart is empty');
                return;
            }
            showToast('🛒 Proceeding to checkout...');
            // In a real app, redirect to checkout page
            // window.location.href = 'checkout.html';
        }

        // ============================================================
        // TOAST NOTIFICATION
        // ============================================================

        let toastTimer = null;

        function showToast(msg) {
            const el = document.getElementById('toast');
            const msgEl = document.getElementById('toastMsg');
            msgEl.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                el.classList.remove('show');
            }, 2500);
        }

        // ============================================================
        // ADD TO CART (exposed globally – call from product pages)
        // ============================================================

        function addToCart(productId, qty = 1, variant = null) {
            const cart = getCart();

            // Try to find product in sampleProducts
            let product = sampleProducts.find(p => p.id === productId);

            // If not found, try to use provided data (for dynamic products)
            if (!product) {
                // If product not found in sample, we need to look for it in the page's data
                // or fallback to a generic entry
                const existingItem = cart.find(item => item.id === productId);
                if (existingItem) {
                    existingItem.qty += qty;
                    saveCart(cart);
                    renderCart();
                    showToast(existingItem.name + ' quantity updated');
                    return;
                }

                // Create a fallback product entry
                product = {
                    id: productId,
                    name: 'Product #' + productId,
                    brand: 'JB Store',
                    price: 0,
                    oldPrice: 0,
                    image: 'https://via.placeholder.com/200/2a2a2a/D4AF37?text=Product'
                };
            }

            // Check if item already in cart (with same variant)
            const uniqueId = variant ? `${productId}_${variant}` : productId;
            const existing = cart.find(item => item.id === uniqueId);

            if (existing) {
                existing.qty += qty;
                saveCart(cart);
                renderCart();
                const displayName = variant ? `${product.name} (${variant})` : product.name;
                showToast(displayName + ' quantity updated');
            } else {
                const newItem = {
                    id: uniqueId,
                    productId: productId,
                    name: product.name,
                    brand: product.brand || 'JB Store',
                    price: product.price || 0,
                    oldPrice: product.oldPrice || 0,
                    image: product.image || 'https://via.placeholder.com/200/2a2a2a/D4AF37?text=Product',
                    qty: qty,
                    variant: variant || 'Default'
                };
                cart.push(newItem);
                saveCart(cart);
                renderCart();
                const displayName = variant ? `${product.name} (${variant})` : product.name;
                showToast('✅ ' + displayName + ' added to cart!');
            }
        }

        // ============================================================
        // FAVORITES BADGE (dummy – update from your fav system)
        // ============================================================

        function updateFavBadge(count) {
            const el = document.getElementById('favBadge');
            if (el) {
                el.textContent = count || 0;
                el.style.display = (count || 0) > 0 ? 'flex' : 'none';
            }
        }

        // ============================================================
        // INIT
        // ============================================================

        document.addEventListener('DOMContentLoaded', function() {
            renderCart();

            // Update fav badge (dummy - set to 3 for demo)
            updateFavBadge(3);

            // Expose addToCart globally so product pages can use it
            window.addToCart = addToCart;
            window.showToast = showToast;
            window.renderCart = renderCart;
            window.clearCart = clearCart;
            window.handleCheckout = handleCheckout;
            window.updateQty = updateQty;
            window.removeItem = removeItem;

            // For demo: if cart is empty, add a couple of sample items
            // so the user can see the populated state immediately.
            // Remove this in production.
            const cart = getCart();
            if (cart.length === 0) {
                // Add 2 sample items for demo
                addToCart(1, 1);
                addToCart(3, 2);
            }

            console.log('🛒 Cart page initialized. Items in cart:', getCart().length);
        });

        // ============================================================
        // SYNC CART ACROSS TABS (storage event)
        // ============================================================

        window.addEventListener('storage', function(e) {
            if (e.key === CART_KEY) {
                renderCart();
            }
        });
    </script>

</body>
</html>
