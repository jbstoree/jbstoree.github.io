<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders • JB STORE</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  html.auth-pending body{visibility:hidden!important;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:'Poppins',Arial,sans-serif;background:#f6f4ee;color:#1a1a1a;padding-bottom:100px;}

  .top-bar{
    position:sticky;top:0;z-index:50;background:#fff;color:#111;
    padding:14px 16px;display:flex;align-items:center;gap:14px;
    border-bottom:1px solid rgba(212,175,55,.25);
    box-shadow:0 2px 12px rgba(0,0,0,.04);
  }
  .top-bar a{color:#111;font-size:22px;text-decoration:none;line-height:1;}
  .top-bar h1{margin:0;font-size:19px;font-weight:700;font-family:Georgia,serif;letter-spacing:.3px;}
  .top-bar h1 span{color:#d4af37;}

  .wrap{padding:16px;}
  .order-card{
    background:#fff;border-radius:16px;margin-bottom:14px;
    padding:16px;box-shadow:0 4px 18px rgba(0,0,0,.06);
    border:1px solid rgba(212,175,55,.18);
  }
  .oc-head{
    display:flex;justify-content:space-between;
    align-items:flex-start;gap:10px;flex-wrap:wrap;
    padding-bottom:12px;border-bottom:1px dashed #eee;margin-bottom:12px;
  }
  .oc-code{font-weight:800;color:#a3801a;letter-spacing:.5px;font-size:15px;}
  .oc-date{font-size:11.5px;color:#999;margin-top:3px;}
  .oc-status{
    font-size:10.5px;font-weight:800;padding:5px 12px;
    border-radius:20px;text-transform:uppercase;letter-spacing:.5px;
  }
  .st-pending   {background:#fff4d6;color:#a3801a;}
  .st-confirmed {background:#e6f4ff;color:#0b6bcb;}
  .st-shipped   {background:#efe6ff;color:#6b3fc7;}
  .st-delivered {background:#e8f7ee;color:#1e8e4a;}
  .st-cancelled {background:#ffe8e8;color:#c02020;}

  .oc-items{margin-bottom:10px;}
  .oc-item{
    display:flex;gap:12px;align-items:center;
    padding:10px 0;border-bottom:1px dashed #f0f0f0;
  }
  .oc-item:last-child{border-bottom:0;}
  .oc-item img{
    width:52px;height:52px;object-fit:contain;background:#faf8f2;
    border-radius:10px;padding:5px;flex-shrink:0;
  }
  .oc-item-info{flex:1;min-width:0;}
  .oc-item-info .nm{font-weight:600;font-size:13.5px;color:#111;line-height:1.3;}
  .oc-item-info .br{font-size:11px;color:#999;margin-top:2px;}
  .oc-item-right{text-align:right;font-size:12.5px;flex-shrink:0;}
  .oc-item-right .qty{color:#666;}
  .oc-item-right .amt{color:#a3801a;font-weight:800;font-size:14px;}

  .oc-total{
    display:flex;justify-content:space-between;align-items:center;
    padding-top:10px;border-top:2px solid #f0ead6;margin-top:4px;
  }
  .oc-total span{font-weight:700;font-size:13px;color:#111;}
  .oc-total strong{font-weight:800;font-size:19px;color:#a3801a;}

  .empty{
    text-align:center;padding:80px 20px;
    background:#fff;border-radius:20px;
    border:1px solid rgba(212,175,55,.18);
  }
  .empty .ic{font-size:64px;margin-bottom:16px;}
  .empty h2{margin:0 0 8px;font-size:22px;font-weight:700;}
  .empty p{color:#888;font-size:14px;margin:0 0 24px;}
  .empty a{
    display:inline-block;background:linear-gradient(135deg,#f0c419,#d4af37);
    color:#111;padding:14px 32px;border-radius:30px;
    text-decoration:none;font-weight:800;font-size:14px;
  }

  .loading{text-align:center;padding:60px 20px;color:#999;font-size:14px;}
  .spinner{
    display:inline-block;width:32px;height:32px;border-radius:50%;
    border:3px solid #f0ead6;border-top-color:#d4af37;
    animation:spin .8s linear infinite;margin-bottom:12px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<script>
(function () {
  document.documentElement.classList.add('auth-pending');
  const U='https://iuucwxdkjqpecqwbsoyv.supabase.co';
  const A='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1dWN3eGRranFwZWNxd2Jzb3l2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjU4MTksImV4cCI6MjEwMzA0MTgxOX0.UPQ7jf3C_9DX9Jr1y-g6JIxBe2EHOlMAn4CZZyQgLDQ';

<div class="top-bar">
  <a href="index.html"><i class="fas fa-arrow-left"></i></a>
  <h1>My <span>Orders</span></h1>
</div>

<div class="wrap" id="ordersWrap">
  <div class="loading"><div class="spinner"></div><div>Loading your orders…</div></div>
</div>

<script>
(function () {
  const SUPABASE_URL = 'https://iuucwxdkjqpecqwbsoyv.supabase.co';
  const SUPABASE_ANON= 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1dWN3eGRranFwZWNxd2Jzb3l2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjU4MTksImV4cCI6MjEwMzA0MTgxOX0.UPQ7jf3C_9DX9Jr1y-g6JIxBe2EHOlMAn4CZZyQgLDQ';
  if (typeof supabase === 'undefined') return;
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
  const wrap = document.getElementById('ordersWrap');

  const money = n => '₹' + Number(n||0).toLocaleString('en-IN');
  const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const STATUS_LABELS = {
    pending:'Pending', confirmed:'Confirmed', shipped:'Shipped',
    delivered:'Delivered', cancelled:'Cancelled'
  };

  async function load() {
    wrap.innerHTML = '<div class="loading"><div class="spinner"></div><div>Loading your orders…</div></div>';

    const { data: { user } } = await sb.auth.getUser();
    if (!user) { location.href = 'login.html'; return; }

    const { data, error } = await sb
      .from('orders')
      .select('*')
      .eq('user_id', user.id)
      .order('created_at', { ascending: false });

    if (error) {
      wrap.innerHTML = `<div class="empty"><div class="ic">⚠️</div><h2>Error</h2><p>${esc(error.message)}</p></div>`;
      return;
    }
    if (!data || !data.length) {
      wrap.innerHTML = `
        <div class="empty">
          <div class="ic">📦</div>
          <h2>No orders yet</h2>
          <p>Meeru inka orders cheyyaledu.</p>
          <a href="index.html">Start Shopping →</a>
        </div>`;
      return;
    }

    wrap.innerHTML = data.map(o => {
      const st = (o.status || 'pending').toLowerCase();
      const stClass = 'st-' + (STATUS_LABELS[st] ? st : 'pending');
      const stLabel = STATUS_LABELS[st] || 'Pending';

      const itemsHtml = (o.items || []).map(it => `
        <div class="oc-item">
          <img src="${esc(it.image||'')}"
               onerror="this.style.background='#f1f3f6';this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2252%22 height=%2252%22><rect width=%2252%22 height=%2252%22 fill=%22%23f1f3f6%22/><text x=%2226%22 y=%2231%22 text-anchor=%22middle%22 font-size=%2218%22 fill=%22%23aaa%22>📦</text></svg>'">
          <div class="oc-item-info">
            <div class="nm">${esc(it.name || 'Product')}</div>
            <div class="br">${esc(it.brand || '')}</div>
          </div>
          <div class="oc-item-right">
            <div class="qty">${it.qty} × ${money(it.price)}</div>
            <div class="amt">${money(it.qty * it.price)}</div>
          </div>
        </div>`).join('');

      const dt = new Date(o.created_at).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'});

      return `
        <div class="order-card">
          <div class="oc-head">
            <div>
              <div class="oc-code">${esc(o.order_code)}</div>
              <div class="oc-date"><i class="far fa-clock"></i> ${esc(dt)}</div>
            </div>
            <span class="oc-status ${stClass}">${esc(stLabel)}</span>
          </div>
          <div class="oc-items">${itemsHtml}</div>
          <div class="oc-total">
            <span>TOTAL</span>
            <strong>${money(o.total)}</strong>
          </div>
        </div>`;
    }).join('');
  }

  load();

  // Realtime — status change ayinapudu auto update
  sb.channel('my-orders')
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'orders'},()=>load())
    .subscribe();
})();
</script>

</body>
</html>
