<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Reset Password • JB STORE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  background:#f7f5ef;
  color:#171717;
  font-family:Poppins,Arial,sans-serif;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;
}

.card{
  width:100%;
  max-width:460px;

  background:#fff;

  border:1px solid #e4d8ae;
  border-radius:24px;

  padding:32px 24px 26px;

  box-shadow:
    0 15px 40px rgba(99,78,21,.12);

  position:relative;
  overflow:hidden;
}

.card::before{
  content:"";

  position:absolute;
  top:0;
  left:0;
  right:0;

  height:5px;

  background:
    linear-gradient(
      90deg,
      #d4af37,
      #f0d36b,
      #d4af37
    );
}

.logo{
  text-align:center;

  font-family:
    "Times New Roman",
    Georgia,
    serif;

  font-size:38px;
  font-weight:700;

  margin-bottom:5px;
}

.logo .jb{
  color:#d4af37;
}

.logo .store{
  color:#171717;
}

.subtitle{
  text-align:center;

  color:#777;

  font-size:12px;

  margin:0 0 25px;
}

h1{
  text-align:center;

  font-family:
    "Times New Roman",
    Georgia,
    serif;

  font-size:28px;

  margin:0 0 9px;

  color:#171717;
}

.gold{
  color:#d4af37;
}

.description{
  text-align:center;

  color:#777;

  font-size:11px;

  line-height:1.6;

  margin:0 auto 22px;

  max-width:360px;
}

label{
  display:block;

  margin:14px 0 7px;

  color:#4f4f4f;

  font-size:11px;
  font-weight:600;
}

.field{
  position:relative;
}

input{
  width:100%;
  height:51px;

  border:1px solid #dedbd2;

  border-radius:13px;

  background:#faf9f6;

  color:#171717;

  padding:0 15px;

  outline:none;

  font-size:13px;
}

input:focus{
  background:#fff;

  border-color:#d4af37;

  box-shadow:
    0 0 0 3px rgba(212,175,55,.11);
}

button{
  width:100%;
  height:52px;

  margin-top:18px;

  border:1px solid #c79e12;

  border-radius:13px;

  background:#d4af37;

  color:#151515;

  font-size:13px;
  font-weight:700;

  cursor:pointer;

  box-shadow:
    0 7px 18px rgba(212,175,55,.22);
}

button:hover{
  background:#e1bd45;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.status{
  min-height:22px;

  margin-top:15px;

  text-align:center;

  font-size:11px;

  line-height:1.5;
}

.back{
  display:block;

  text-align:center;

  margin-top:18px;

  color:#777;

  text-decoration:none;

  font-size:10px;
}

.back:hover{
  color:#a27e1c;
}

.success{
  color:#4d8a55;
}

.error{
  color:#b33a3a;
}

@media(max-width:480px){

  body{
    padding:12px;
  }

  .card{
    border-radius:22px;
    padding:28px 18px 22px;
  }

  .logo{
    font-size:34px;
  }

  h1{
    font-size:26px;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    <span class="jb">JB</span>
    <span class="store"> STORE</span>
  </div>

  <p class="subtitle">
    Premium Electronics
  </p>

  <h1>
    Reset <span class="gold">Password</span>
  </h1>

  <p class="description">
    Enter your new password below to secure your JB STORE account.
  </p>

  <label for="password">
    New Password
  </label>

  <div class="field">
    <input
      id="password"
      type="password"
      autocomplete="new-password"
      placeholder="Enter new password"
    >
  </div>

  <label for="confirmPassword">
    Confirm Password
  </label>

  <div class="field">
    <input
      id="confirmPassword"
      type="password"
      autocomplete="new-password"
      placeholder="Confirm new password"
    >
  </div>

  <button id="updateBtn">
    Update Password
  </button>

  <div id="status" class="status"></div>

  <a href="login.html" class="back">
    ← Back to JB STORE Login
  </a>

</div>

<script>

const SUPABASE_URL =
  'https://iuucwxdkjqpecqwbsoyv.supabase.co';

const SUPABASE_ANON =
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml1dWN3eGRranFwZWNxd2Jzb3l2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjU4MTksImV4cCI6MjEwMzA0MTgxOX0.UPQ7jf3C_9DX9Jr1y-g6JIxBe2EHOlMAn4CZZyQgLDQ';

const client =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON,
    {
      auth:{
        flowType:'implicit',
        detectSessionInUrl:true,
        persistSession:true,
        autoRefreshToken:true
      }
    }
  );

const passwordInput =
  document.getElementById('password');

const confirmInput =
  document.getElementById('confirmPassword');

const updateBtn =
  document.getElementById('updateBtn');

const status =
  document.getElementById('status');

function showStatus(message, type=''){
  status.textContent = message;

  status.className =
    'status ' + type;
}


/*
 * Supabase sends PASSWORD_RECOVERY
 * after the recovery link creates the session.
 */

let recoverySessionReady = false;

client.auth.onAuthStateChange(
  async (event, session) => {

    console.log(
      'Supabase auth event:',
      event
    );

    if (
      event === 'PASSWORD_RECOVERY' &&
      session
    ){

      recoverySessionReady = true;

      showStatus(
        'Enter your new password.',
        ''
      );

      return;
    }

    /*
     * Some browser flows may restore
     * the recovery session as INITIAL_SESSION.
     */

    if (
      event === 'INITIAL_SESSION' &&
      session
    ){

      recoverySessionReady = true;

      showStatus(
        'Enter your new password.',
        ''
      );
    }

  }
);


/*
 * Check whether the recovery session
 * already exists when the page loads.
 */

(async function(){

  try{

    const {
      data,
      error
    } = await client.auth.getSession();

    if(error){

      console.error(error);

      showStatus(
        'Password reset link is invalid or expired.',
        'error'
      );

      return;
    }

    if(data && data.session){

      recoverySessionReady = true;

      showStatus(
        'Enter your new password.',
        ''
      );

    }else{

      showStatus(
        'Please open the password reset link from your email.',
        'error'
      );

    }

  }catch(error){

    console.error(error);

    showStatus(
      'Unable to verify password reset session.',
      'error'
    );

  }

})();


updateBtn.addEventListener(
  'click',
  async function(){

    const password =
      passwordInput.value;

    const confirmPassword =
      confirmInput.value;


    if(!password || !confirmPassword){

      showStatus(
        'Please enter and confirm your new password.',
        'error'
      );

      return;
    }


    if(password.length < 6){

      showStatus(
        'Password must be at least 6 characters.',
        'error'
      );

      return;
    }


    if(password !== confirmPassword){

      showStatus(
        'Passwords do not match.',
        'error'
      );

      return;
    }


    updateBtn.disabled = true;

    showStatus(
      'Updating your password…',
      ''
    );


    try{

      const {
        data,
        error
      } =
        await client.auth.updateUser({
          password: password
        });


      if(error){

        console.error(
          'Password update error:',
          error
        );

        showStatus(
          error.message ||
          'Unable to update password.',
          'error'
        );

        updateBtn.disabled = false;

        return;
      }


      if(data && data.user){

        showStatus(
          'Password updated successfully. Redirecting to login…',
          'success'
        );


        /*
         * Sign out after password reset
         * so the user can log in normally
         * with the new password.
         */

        setTimeout(
          async function(){

            await client.auth.signOut();

            window.location.replace(
              'login.html'
            );

          },
          1800
        );

      }else{

        showStatus(
          'Password update completed.',
          'success'
        );

        updateBtn.disabled = false;
      }

    }catch(error){

      console.error(error);

      showStatus(
        error?.message ||
        'Something went wrong.',
        'error'
      );

      updateBtn.disabled = false;
    }

  }
);

</script>

</body>
</html>
